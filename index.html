<title>Pac-Man</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* Layout: one arcade screen, centered in a dark cabinet, controls tucked beneath */
  :root {
    --cab: #07081a;        /* cabinet surround, blue-black */
    --screen: #000000;     /* CRT black */
    --maze: #2a3cff;       /* maze blue */
    --pac: #ffe600;        /* pac yellow */
    --ink: #b9bddc;        /* muted label text */
    --ink-dim: #6b6f93;
    --edge: #1a1d44;
    --display: "Press Start 2P", "Courier New", monospace;
    --mono: "Space Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--cab);
    color: var(--ink);
    font-family: var(--mono);
    overflow: hidden;
  }
  main {
    height: 100%;
    box-sizing: border-box;
    padding-inline: 16px;
    padding-block: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  canvas {
    display: block;
    background: var(--screen);
    border-radius: 6px;
    box-shadow: 0 0 0 1px var(--edge), 0 0 40px rgba(42, 60, 255, 0.18);
    touch-action: none;
    max-width: 100%;
  }
  canvas:focus-visible { outline: 2px solid var(--pac); outline-offset: 3px; }
  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px 18px;
    font-size: 12px;
    letter-spacing: 0.02em;
  }
  .keys { color: var(--ink-dim); }
  kbd {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink);
    border: 1px solid var(--edge);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 5px;
  }
  .btn {
    font-family: var(--display);
    font-size: 9px;
    letter-spacing: 0.08em;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--edge);
    border-radius: 4px;
    padding: 8px 10px;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--maze); color: #fff; }
  .btn:focus-visible { outline: 2px solid var(--pac); outline-offset: 2px; }
  .btn[aria-pressed="true"] { border-color: var(--pac); color: var(--pac); }
  .dpad {
    display: none;
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(3, 52px);
    gap: 4px;
  }
  .dpad button {
    background: var(--edge);
    border: 0;
    border-radius: 10px;
    color: var(--ink);
    font-size: 18px;
    touch-action: none;
  }
  .dpad button:active { background: var(--maze); color: #fff; }
  .dpad .u { grid-area: 1 / 2; } .dpad .l { grid-area: 2 / 1; }
  .dpad .r { grid-area: 2 / 3; } .dpad .d { grid-area: 3 / 2; }
  .dpad .c { grid-area: 2 / 2; font-family: var(--display); font-size: 8px; letter-spacing: 0.05em; }
  .dpad .c:disabled { opacity: 0.35; }
  @media (pointer: coarse) {
    .dpad { display: grid; }
    .keys { display: none; }
  }
</style>

<main id="main">
  <canvas id="game" tabindex="0" aria-label="Pac-Man game. Use arrow keys to move."></canvas>
  <div class="dpad" id="dpad" aria-label="Direction pad">
    <button class="u" data-dir="U" aria-label="Up">▲</button>
    <button class="l" data-dir="L" aria-label="Left">◀</button>
    <button class="r" data-dir="R" aria-label="Right">▶</button>
    <button class="d" data-dir="D" aria-label="Down">▼</button>
    <button class="c" id="dashBtn" type="button" aria-label="Dash" disabled>DASH</button>
  </div>
  <div class="bar" id="bar">
    <span class="keys"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>WASD</kbd> move · <kbd>Enter</kbd> select / next · <kbd>Esc</kbd> back / skip talk · <kbd>P</kbd> pause · <kbd>Space</kbd> dash · <kbd>M</kbd> sound · <kbd>F</kbd> effects · <kbd>I</kbd> infinite lives · <kbd>N</kbd> skip level · <kbd>U</kbd> unlock all</span>
    <button class="btn" id="pauseBtn" type="button">PAUSE</button>
    <button class="btn" id="soundBtn" type="button">SOUND ON</button>
    <button class="btn" id="fxBtn" type="button" aria-pressed="true">FX: ON</button>
    <button class="btn" id="infBtn" type="button" aria-pressed="false">INFINITE LIVES: OFF</button>
    <button class="btn" id="skipBtn" type="button">SKIP LEVEL</button>
    <button class="btn" id="unlockBtn" type="button">UNLOCK ALL</button>
  </div>
</main>

  // Tiles Pac-Man can reach; a frozen Wraith gets pushed onto the nearest one.
  openMask = new Uint8Array(W * H);
  const q = [[Math.floor(meta.pac.x), meta.pac.y]];
  openMask[meta.pac.y * W + Math.floor(meta.pac.x)] = 1;
  while (q.length) {
    const [c, r] = q.pop();
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nc = c + dx, nr = r + dy;

// Dash: 4 tiles at high speed along the corridor, passing through enemies unharmed.

// ---------- Basement hazards ----------

// Mazes that rebuild themselves mid-level. Every so often clouds (or, in the crypt, bone dust) roll

  if (count >= limit || G.idle >= 4) {
    G.idle = 0;
    if (!iceHouse()) g.mode = 'leave';
    else if (!(g.crack > 0)) g.crack = ICE_CRACK;
  }
}

// ---------- Play loop ----------
// Eat the dot at (c, r): under Pac-Man, or pulled in by the magnet.
function eatDot(c = Math.round(pac.x), r = Math.round(pac.y), pulled = false) {
  if (c < 0 || c >= W) return;
  const i = r * W + c, v = G.dots[i];
  if (!v) return;
  G.dots[i] = 0; G.dotsLeft--; G.dotsEaten++; G.idle = 0;
  fxDot(c, r, v);
  if (G.globalMode) G.globalDots++;
  else { const h = [pinky, inky, clyde].find(g => G.ghosts.includes(g) && g.mode === 'house'); if (h) h.dotCount++; }
  if (pulled) { G.flyDots.push({ x: c, y: r, t: 0 }); if (G.flyDots.length % 3 === 1) SFX.pull(); }
  else SFX.dot();
  if (v === 1) {
    addScore(10);
    if (G.boss && G.boss.kind === 'blob' && G.boss.state !== 'dead' && bossPhase(G.boss) === 1) blobHurt(BLOB_DOT);
  } else if (v === 5) {
    addScore(100); SFX.magnet();
    G.magnet = MAGNET_TIME;
    popup('MAGNET!', c, r - 1, '#ff4f4f', 1.4);
  } else if (v === 2) {
    addScore(50);
    SFX.power();
    const ft = G.cfg.fright;
    G.fright = ft; G.combo = 0;
    for (const g of G.ghosts) {
      if (g.eaten) continue;
      if (g.mode === 'active') g.reverse = true;
      if (ft > 0) g.frightened = true;
    }
  } else if (v === 3) {
    addScore(50);
    SFX.frost();
    G.chill = G.cfg.chill || 5;
    for (const w of G.wraiths) w.reach = w.state === 'active' || w.state === 'leave' ? reachTiles(w) : null;
  }
  if (G.cfg.boss) { if (v === 2 || v === 3) G.respawns.push({ i, v, t: v === 2 ? (G.cfg.boss === 'blob' ? 20 : 12) : 20 }); G.orbs = v === 3 ? [] : G.orbs; return; }
  const f1 = Math.round(G.dotsTotal * 0.3), f2 = Math.round(G.dotsTotal * 0.7);
  if (G.dotsEaten === f1 || G.dotsEaten === f2) G.fruit = { kind: fruitFor(G.lvIndex), timer: 9.5 };
  if (G.dotsLeft === 0) { G.state = 'clear'; G.timer = 0; SFX.clear(); }
}

// A level's enemyMul slows every enemy (but not Pac-Man) by that factor.
const ENEMY_SPEEDS = ['ghost', 'ghostF', 'tunnel', 'wraith', 'slime', 'slimeS', 'slimeF'];
function tierSpeeds() {
  const t = TIERS[G.cfg.tier], k = G.cfg.enemyMul;
  if (!k) return t;
  const sp = { ...t };
  for (const key of ENEMY_SPEEDS) sp[key] *= k;
  return sp;
}

function play(dt) {
  const sp = tierSpeeds();
  if (G.boss && G.boss.state === 'dead') {
    G.boss.dead += dt;
    if (G.boss.dead >= 2.8) { G.state = 'clear'; G.timer = 0; SFX.clear(); }
    return;
  }
  if (held.length && G.want && pac.dir && G.want === pac.dir.o) { pac.dir = G.want; pac.face = G.want; }
  if (held.length && G.want && !pac.dir && !onCenter(pac)) { // standing between two tiles (like at the start): head along the corridor
    const alongX = Math.abs(pac.x - Math.round(pac.x)) > 1e-6, w = G.want;
    pac.dir = (alongX ? w.x : w.y) ? w : alongX ? (pac.x % 1 < 0.5 ? L : R) : (pac.y % 1 < 0.5 ? U : D);
    pac.face = pac.dir;
  }
  const dashing = pac.dash > 0;
  const webbed = !dashing && G.webs.size > 0 && G.webs.has(webKey(pac.x, pac.y)); // stuck in a web: half speed
  const moved = step(pac, dt * BASE * (G.fright > 0 ? sp.pacF : sp.pac) * (dashing ? DASH_SPEED : flowMul(pac) * (webbed ? WEB_SLOW : 1)), pacAtCenter, true);
  pac.anim += moved;
  if (dashing) {
    pac.trail.unshift({ x: pac.x, y: pac.y });
    if (pac.trail.length > 8) pac.trail.pop();
    pac.dash -= moved;
    if (pac.dash <= 0 || !pac.dir) { pac.dash = 0; pac.grace = 0.25; }
  } else {
    if (pac.trail.length) pac.trail.pop();
    if (G.cfg.dash) G.dashCharge = Math.min(1, G.dashCharge + dt / DASH_RECHARGE);
  }
  if (pac.grace > 0) pac.grace -= dt;
  const safe = pac.dash > 0 || pac.grace > 0;
  eatDot();
  if (G.state !== 'play') return;
  if (G.magnet > 0) { magnetUpdate(dt); if (G.state !== 'play') return; }
  for (const f of G.flyDots) f.t += dt;
  G.flyDots = G.flyDots.filter(f => f.t < MAGNET_FLY);
  if (G.hounds.length) {
    const p = pacTile(), k = p.y * W + p.x;
    if (k !== G.pacKey && pac.x > -0.5 && pac.x < W - 0.5) { G.pacKey = k; houndsTrack(dashing); }
  }
  if (G.cfg.dark) { // light swells while powered up, and gutters on the flickering floor
    const want = G.cfg.dark + (G.fright > 0 ? 2.6 : 0);
    G.light += (want - G.light) * Math.min(1, dt * 3);
  }
  if (G.webs.size) {
    if (dashing && G.webs.delete(webKey(pac.x, pac.y))) { SFX.tear(); popup('RIP!', pac.x, pac.y - 1, '#e6e9ff', 0.5); webTear(Math.round(pac.x), Math.round(pac.y)); }
    for (const [k, t] of G.webs) { if (t <= dt) G.webs.delete(k); else G.webs.set(k, t - dt); }
  }
  if (G.reform.on) { reformUpdate(dt); if (G.state !== 'play') return; }
  if (G.cfg.flicker) { // every so often the lights die completely and everyone creeps
    if (G.fright > 0) G.blackout = 0; // a power pellet relights the room
    else if (G.blackout > 0) G.blackout = Math.max(0, G.blackout - dt);
    else if (G.fright === 0 && (G.blackT -= dt) <= 0) { G.blackout = BLACKOUT_TIME; G.blackT = 7 + Math.random() * 5; }
  }

  if (G.chill > 0) G.chill = Math.max(0, G.chill - dt);
  if (G.fright > 0) {
    G.fright -= dt;
    if (G.fright <= 0) { G.fright = 0; G.ghosts.forEach(g => { g.frightened = false; }); }
  } else if (G.chill === 0) {
    G.modeTime += dt;
    if (G.modeTime >= (G.cfg.schedule || SCHEDULES[G.cfg.tier])[G.modeIdx]) {
      G.modeTime = 0; G.modeIdx++;
      G.ghosts.forEach(g => { if (g.mode === 'active' && !g.eaten) g.reverse = true; });
    }
  }
  releaseCheck(dt);
  const edt = G.blackout > 0 ? dt * BLACKOUT_SLOW : dt;
  for (const g of G.ghosts) ghostUpdate(g, edt, sp);
  for (const w of G.wraiths) wraithUpdate(w, edt, sp);
  for (const s of G.slimes) slimeUpdate(s, edt, sp);
  for (const h of G.hounds) houndUpdate(h, edt, sp);
  for (const g of G.gargoyles) gargoyleUpdate(g, edt, sp);
  for (const s of G.spiders) spiderUpdate(s, edt, sp);
  const creeping = G.gargoyles.some(g => g.moving);
  if (creeping && !G.gargMoving) SFX.grind(); // stone grinding as a statue starts to move
  G.gargMoving = creeping;
  if (G.vents.length) ventsUpdate(dt);
  if (G.boss) {
    if (G.boss.kind === 'blob') { blobUpdate(dt, sp); blobCrewUpdate(dt); }
    else if (G.boss.kind === 'skull') { skullUpdate(dt, sp); bonesUpdate(dt); G.spiders = G.spiders.filter(s => !(s.boss && s.state === 'eaten')); }
    else bossUpdate(dt, sp);
    for (const m of G.minions) { if (m.fresh > 0) m.fresh -= dt; if (G.chill === 0) step(m, (G.fright > 0 ? 0.45 : 0.7) * BASE * dt, slimeAtCenter, false); }
    orbsUpdate(dt);
    for (const r of G.respawns) if ((r.t -= dt) <= 0) { G.dots[r.i] = r.v; G.dotsLeft++; }
    G.respawns = G.respawns.filter(r => r.t > 0);
  }

  if (G.fruit) {
    G.fruit.timer -= dt;
    if (G.fruit.timer <= 0) G.fruit = null;
    else if (pac.y === meta.fruit.y && Math.abs(pac.x - meta.fruit.x) < 0.8) {
      const pts = FRUIT_PTS[G.fruit.kind];
      addScore(pts); SFX.fruit();
      popup(String(pts), meta.fruit.x, meta.fruit.y, '#ffb8ff', 2);
      G.fruit = null;
    }
  }
  for (const p of G.popups) p.t -= dt;
  G.popups = G.popups.filter(p => p.t > 0);

  for (const g of G.ghosts) {
    if (g.mode !== 'active' || g.eaten) continue;
    let dx = Math.abs(g.x - pac.x);
    if (dx > W / 2) dx = W + 2 - dx;
    if (dx >= 0.6 || Math.abs(g.y - pac.y) >= 0.6) continue;
    if (G.chill > 0) {
      g.eaten = true; g.frightened = false;
      addScore(300); SFX.shatter();
      popup('300', g.x, g.y, '#bdf4ff');
      continue;
    }
    if (g.frightened) {
      g.frightened = false; g.eaten = true;
      const pts = 200 * 2 ** G.combo; G.combo++;
      addScore(pts); SFX.ghost();
      G.eatenGhost = g;
      popup(String(pts), g.x, g.y, '#00f0ff', 0.9, true);
      G.state = 'eatpause'; G.timer = 0.9;
      return;
    }
    if (safe) continue;
    G.state = 'dying'; G.timer = 0;
    return;
  }
  for (const w of G.wraiths) {
    const frozenHere = G.chill > 0 && (w.state === 'active' || w.state === 'leave');
    if (w.state !== 'active' && !frozenHere) continue;
    const touching = Math.hypot(w.x - pac.x, w.y - pac.y) < 0.7 ||
      (frozenHere && w.reach && w.reach.some(t => Math.abs(t.x - pac.x) < 0.6 && Math.abs(t.y - pac.y) < 0.6));
    if (!touching) continue;
    if (G.chill > 0) {
      w.state = 'eaten';
      if (curTheme().freezer) frzShatter(w.x, w.y);
      addScore(500); SFX.shatter(); SFX.ghost();
      popup('500', w.x, w.y, '#bdf4ff');
      continue;
    }
    if (safe) continue;
    G.state = 'dying'; G.timer = 0;
    return;
  }
  for (const s of [...G.slimes]) {
    if (s.state !== 'active' || s.fresh > 0) continue;
    let dx = Math.abs(s.x - pac.x);
    if (dx > W / 2) dx = W + 2 - dx;
    const rad = s.kind === 'big' ? 0.7 : 0.55;
    if (dx >= rad || Math.abs(s.y - pac.y) >= rad) continue;
    if (G.fright > 0 || G.chill > 0) { eatSlime(s); continue; }
    if (safe) continue;
    G.state = 'dying'; G.timer = 0;
    return;
  }
  for (const h of G.hounds) {
    if (h.state !== 'hunt' || Math.abs(h.x - pac.x) >= 0.6 || Math.abs(h.y - pac.y) >= 0.6) continue;
    if (G.fright > 0 || G.chill > 0) {
      h.state = 'eaten';
      addScore(G.chill > 0 ? 300 : 400); G.chill > 0 ? SFX.shatter() : SFX.ghost();
      popup(G.chill > 0 ? '300' : '400', h.x, h.y, '#ffc98f');
      continue;
    }
    if (safe) continue;
    G.state = 'dying'; G.timer = 0;
    return;
  }
  for (const g of G.gargoyles) {
    if (g.state !== 'active' && g.state !== 'perch') continue;
    let dx = Math.abs(g.x - pac.x);
    if (dx > W / 2) dx = W + 2 - dx;
    if (dx >= 0.6 || Math.abs(g.y - pac.y) >= 0.6) continue;
    if (safe || G.chill > 0) { smashGargoyle(g); continue; } // dashing (or frozen solid): shatter it
    G.state = 'dying'; G.timer = 0;
    return;
  }
  for (const s of G.spiders) {
    if (s.state !== 'active' || s.fresh > 0) continue;
    let dx = Math.abs(s.x - pac.x);
    if (dx > W / 2) dx = W + 2 - dx;
    if (dx >= 0.6 || Math.abs(s.y - pac.y) >= 0.6) continue;
    if (G.fright > 0 || G.chill > 0) {
      s.state = 'eaten';
      addScore(400); G.chill > 0 ? SFX.shatter() : SFX.ghost();
      popup('400', s.x, s.y, '#d9b3ff');
      continue;
    }
    if (safe) continue;
    G.state = 'dying'; G.timer = 0;
    return;
  }
  if (!safe && G.vents.length && inSteam(pac.x, pac.y)) { G.state = 'dying'; G.timer = 0; return; }
  const b = G.boss;
  if (b && b.kind === 'king' && b.state !== 'dead' && Math.abs(b.x - pac.x) < 1.5 && Math.abs(b.y - pac.y) < 1.5) {
    if (G.fright > 0 && b.inv <= 0 && b.state !== 'recoil') { hitBoss(); return; }
    if (!(G.chill > 0 || safe || b.state === 'recoil' || b.inv > 1.2)) { G.state = 'dying'; G.timer = 0; return; }
  }
  if (b && b.kind === 'blob' && b.state !== 'dead') {
    for (const s of G.buddies) {
      if (s.state !== 'active' || Math.abs(s.x - pac.x) >= 0.7 || Math.abs(s.y - pac.y) >= 0.7) continue;
      s.state = 'saved'; s.t = 0;
      addScore(400); SFX.ghost();
      popup('400', s.x, s.y, '#00f0ff');
      blobHurt(BLOB_SAVE);
    }
    for (const s of G.blobules) {
      if (s.fresh > 0 || Math.abs(s.x - pac.x) >= 0.65 || Math.abs(s.y - pac.y) >= 0.65) continue;
      s.state = 'eaten';
      addScore(300); SFX.ghost(); popup('300', s.x, s.y, '#9be86f');
      blobHurt(s.share || 0);
      if (b.state === 'dead') break;
    }
    G.blobules = G.blobules.filter(s => s.state === 'active');
    if (blobTouch(pac)) {
      if (G.fright > 0 && b.inv <= 0 && b.state !== 'recoil') { biteBlob(); return; }
      if (!(G.chill > 0 || safe || b.state === 'recoil' || b.inv > 1)) { G.state = 'dying'; G.timer = 0; return; }
    }
  }
  if (b && b.kind === 'skull' && b.state !== 'dead') {
    for (const s of G.bones) {
      if (s.fresh > 0 || Math.abs(s.x - pac.x) >= 0.65 || Math.abs(s.y - pac.y) >= 0.65) continue;
      s.state = 'home'; // eaten: it never makes it back
      addScore(300); SFX.ghost(); popup('300', s.x, s.y, '#fff4d0');
      skullHurt(s.share);
      if (b.state !== 'dead' && !G.pendingPhase && (!G.bossSay || G.bossSay.t < 1)) bossLine(SKULL_LINES.bone);
    }
    G.bones = G.bones.filter(s => s.state !== 'home');
    if (b.state !== 'dead' && Math.abs(b.x - pac.x) < 1.5 && Math.abs(b.y - pac.y) < 1.5 && b.state === 'chase') {
      if (G.fright > 0 && b.inv <= 0) { hitSkull(); return; }
      if (!(G.chill > 0 || safe || b.inv > 1)) { G.state = 'dying'; G.timer = 0; return; }
    }
  }
  for (const m of [...G.minions]) {
    if (m.fresh > 0 || Math.abs(m.x - pac.x) >= 0.6 || Math.abs(m.y - pac.y) >= 0.6) continue;
    if (G.fright > 0 || G.chill > 0) {
      G.minions.splice(G.minions.indexOf(m), 1);
      addScore(200); SFX.ghost(); popup('200', m.x, m.y, '#00f0ff');
      continue;
    }
    if (safe) continue;
    G.state = 'dying'; G.timer = 0;
    return;
  }
  for (const o of G.orbs) if (o.web && Math.abs(o.x - pac.x) < 0.6 && Math.abs(o.y - pac.y) < 0.6) { splatWeb(Math.round(pac.x), Math.round(pac.y)); o.gone = true; } // webs you, doesn't hurt
  G.orbs = G.orbs.filter(o => !o.gone);
  for (const cp of G.centipedes) if (!safe && centiSegments(cp).some(s => Math.hypot(s.x - pac.x, s.y - pac.y) < CENTI_R + 0.25)) { G.state = 'dying'; G.timer = 0; return; }
  if (!safe && G.orbs.some(o => !o.web && Math.abs(o.x - pac.x) < 0.55 && Math.abs(o.y - pac.y) < 0.55)) { G.state = 'dying'; G.timer = 0; }
}

function update(dt) {
  G.t += dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt);
  if (G.paused) return;
  if (G.bossSay && (G.state === 'play' || G.state === 'phase' || G.state === 'ready') && (G.bossSay.t -= dt) <= 0) G.bossSay = null;
  switch (G.state) {
    case 'ready':
      G.timer -= dt;
      if (G.timer <= 0) { G.state = 'play'; if (G.boss && G.boss.hp === BOSSES[G.boss.kind].hp && !G.bossSay) bossTalk(BOSSES[G.boss.kind].lines.start); }
      break;
    case 'play': if (G.hitstop > 0) { G.hitstop -= dt; break; } play(dt); if (G.pendingPhase && G.state === 'play') startPhase(G.pendingPhase); break;
    case 'phase': G.timer -= dt; if (G.timer <= 0) endPhase(); break;
    case 'eatpause':
      G.timer -= dt;
      if (G.timer <= 0) { G.state = 'play'; G.eatenGhost = null; G.popups = G.popups.filter(p => !p.freeze); }
      break;
    case 'dying': {
      const before = G.timer; G.timer += dt;
      if (before < 1 && G.timer >= 1) SFX.death();
      if (G.timer >= 3.2) {
        if (!infinite) G.lives--;
        if (G.lives <= 0) { G.state = 'over'; G.timer = 0; }
        else {
          resetActors();
          if (G.boss) { const t = BOSSES[G.boss.kind].lines.taunt; bossTalk(t[Math.floor(Math.random() * t.length)]); }
          G.globalMode = true; G.globalDots = 0; G.bannerFull = false; G.state = 'ready'; G.timer = 2;
        }
      }
      break;
    }
    case 'clear':
      G.timer += dt;
      if (G.timer >= (G.cfg.boss ? 5.5 : 3)) finishLevel();
      break;
    case 'over': G.timer += dt; break;
    case 'dialog': dialogUpdate(dt); break;
    case 'menu': case 'cast': case 'tower': case 'ending': menuUpdate(dt); break;
  }
}

// ---------- Drawing ----------
const FONT = 'px "Press Start 2P", "Courier New", monospace';
function text(s, col, row, color, align = 'left', size = 0.85) {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.font = Math.round(px * size) + FONT;
  ctx.textBaseline = 'middle';
  ctx.textAlign = align;
  ctx.fillStyle = color;
  ctx.fillText(s, col * px, (row + 0.5) * px);
  ctx.restore();
}
let shakeX = 0, shakeY = 0;
function screenSpace() { ctx.setTransform(px, 0, 0, px, 0, 0); }

function drawPac(x, y, face, open, r = 0.8) {
  const cx = x + 0.5, cy = y + 0.5, a = 0.02 + open * 0.3 * Math.PI;
  ctx.fillStyle = '#ffe600';
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, r, face.a + a, face.a - a + Math.PI * 2);
  ctx.closePath();
  ctx.fill();
}
function drawPacDeath(x, y, p) {
  const cx = x + 0.5, cy = y + 0.5;
  if (p < 1) {
    const a = 0.05 + p * Math.PI * 0.95;
    ctx.fillStyle = '#ffe600';
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, 0.8, -Math.PI / 2 + a, -Math.PI / 2 - a + Math.PI * 2);
    ctx.closePath(); ctx.fill();
  } else if (p < 1.3) {
    ctx.strokeStyle = '#ffe600'; ctx.lineWidth = 0.12; ctx.lineCap = 'round';
    const k = (p - 1) / 0.3;
    for (let i = 0; i < 8; i++) {
      const ang = i * Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang) * (0.3 + k * 0.3), cy + Math.sin(ang) * (0.3 + k * 0.3));
      ctx.lineTo(cx + Math.cos(ang) * (0.6 + k * 0.3), cy + Math.sin(ang) * (0.6 + k * 0.3));
      ctx.stroke();
    }
  }
}
const iceOn = () => G.chill > 0 && !(G.chill < 1.5 && Math.floor(G.chill * 6) % 2 === 0);
function drawGhost(g) {
  const cx = g.x + 0.5, cy = g.y + 0.5, r = 0.8;
  const fr = (g.frightened && G.fright > 0) || g.panic;
  const flash = fr && !g.panic && G.fright < 2 && Math.floor(G.fright * 5) % 2 === 0;
  const ice = !g.eaten && iceOn();
  if (!g.eaten) {
    ctx.fillStyle = ice ? '#bdf4ff' : fr ? (flash ? '#ffffff' : '#2121ff') : g.color;
    ctx.beginPath();
    ctx.arc(cx, cy - 0.05, r, Math.PI, 0);
    const bottom = cy + r * 0.95, n = 8, phase = G.chill > 0 ? 0 : Math.floor(G.t * 8) % 2;
    ctx.lineTo(cx + r, bottom);
    for (let i = 1; i <= n; i++) ctx.lineTo(cx + r - i * (2 * r / n), (i + phase) % 2 ? bottom - 0.24 : bottom);
    ctx.closePath();
    ctx.fill();
    if (ice) {
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 0.1; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx - 0.5, cy - 0.35); ctx.lineTo(cx - 0.25, cy - 0.65); ctx.stroke();
    }

    ctx.fillRect(cx + 0.18, cy - 0.3, 0.18, 0.18);
    ctx.strokeStyle = face; ctx.lineWidth = 0.09; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let i = 0; i <= 6; i++) ctx.lineTo(cx - 0.55 + i * (1.1 / 6), cy + 0.3 + (i % 2 ? -0.1 : 0.05));
    ctx.stroke();
    return;
  }

// ---------- Story screens ----------
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function wrapText(s, maxW, size) {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.font = Math.round(px * size) + FONT;
  const out = []; let cur = '';
  for (const w of s.split(' ')) {
    const t = cur ? cur + ' ' + w : w;
    if (cur && ctx.measureText(t).width > maxW * px) { out.push(cur); cur = w; } else cur = t;
  }
  if (cur) out.push(cur);
  ctx.restore();
  return out;
}

function drawDialog() {
  const d = G.dlg, [who, msg, mood] = d.lines[d.i], sp = SPEAKERS[who];
  const typing = d.chars < msg.length;
  screenSpace();
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, SCREEN_COLS, TOTAL_ROWS);
  const bx = 0.7, by = 26.4, bw = 26.6, bh = 8.6;
  ctx.fillStyle = '#000000'; ctx.fillRect(bx, by, bw, bh);
  ctx.lineWidth = 0.14; ctx.strokeStyle = sp.color; ctx.strokeRect(bx, by, bw, bh);
  ctx.lineWidth = 0.06; ctx.strokeStyle = '#ffffff'; ctx.strokeRect(bx + 0.3, by + 0.3, bw - 0.6, bh - 0.6);
  let tx = bx + 1;
  if (sp.portrait) {
    const s = 5.4, x = bx + 0.9, y = by + 1.9;
    screenSpace();
    drawPortrait(who, mood, typing, x, y, s);
    screenSpace();
    ctx.lineWidth = 0.1; ctx.strokeStyle = sp.color; ctx.strokeRect(x, y, s, s);
    tx = x + s + 0.8;
  }
  text(sp.name, tx, by + 0.75, sp.color, 'left', 0.55);
  const lines = wrapText(msg, bx + bw - 0.9 - tx, 0.5);
  let left = Math.floor(d.chars);
  lines.forEach((l, j) => {
    if (left <= 0) return;
    text(l.slice(0, left), tx, by + 2.1 + j * 1.15, who === 'NARR' ? '#b9bddc' : '#ffffff', 'left', 0.5);
    left -= l.length + 1;
  });
  text(`${d.i + 1}/${d.lines.length}  ESC SKIP`, bx + bw - 0.8, by + 0.75, '#6b6f93', 'right', 0.36);
  if (!typing && Math.floor(G.t * 3) % 2 === 0) {
    screenSpace();
    ctx.fillStyle = '#ffe600';
    const ax = bx + bw - 1.4, ay = by + bh - 1.35;
    ctx.beginPath(); ctx.moveTo(ax - 0.35, ay - 0.2); ctx.lineTo(ax + 0.35, ay - 0.2); ctx.lineTo(ax, ay + 0.25); ctx.fill();
  }
}

// A lap of Pac-Man chased by the cast, then a lap chasing the blue ghosts back, like the attract mode.
function drawParade(row, speed = 7) {
  const lap = 52, p = (G.t * speed) % (lap * 2), chase = p < lap;
  const open = (1 - Math.cos(G.t * 18)) / 2;
  if (chase) {
    const x = p - 2, crew = ['BLINKY', 'PINKY', 'INKY', 'CLYDE', 'WRAITH', 'SLIME'];
    drawCharacter('PAC', null, x, row, 1, R, open);
    crew.forEach((c, k) => drawCharacter(c, null, x - 2.3 * (k + 1), row, 1, R));
  } else {

// ---------- The Attic (stage 10) ----------
// 14F-16F, where nobody has dusted since the tower was built: pine boards under a thick coat of dust,
// stud walls stuffed with pink insulation, beams furred with grey. Trunks, labelled boxes, furniture
// under dust sheets, a stopped clock, bare bulbs swinging on their cords and a round window letting in
// the moon. Pac-Man sweeps a trail through the dust wherever he goes. Every so often the old house
// settles: a creak, dust pouring off the rafters, the bulbs swinging and stuttering. The ghost house is
// the attic hatch, its pull-down ladder going into the dark. 14F is the attic proper, 15F Cobweb
// Corner (lath and plaster, a rocking chair that rocks when the Wraith goes by, a dressmaker's dummy,
// Great-Grandpa Pac's portrait), 16F the Spider Nest (silk over everything, egg sacs that spill
// spiderlings when you pass, and ghosts wrapped up and hung on the walls for later).
const ATTIC_DUST = {
  1: ['CLEAN ME', 'PAC WAS HERE', 'DO NOT OPEN'],

function atticTheme(lv) {
  const corner = lv === 2, nest = lv === 3;

    pineA: '#5a4632', pineB: '#66503a', seam: '#241a10', nail: '#3a3028', dust: '#8a8274', dustHi: '#a29a8a', silk: '#d8d8e0',
    drop: '#0a0806', dropLine: '#16100a',
    stud: '#6a5238', studHi: '#86694a', studLo: '#3e2e1e', insul: '#c88e8e', insulHi: '#e0aaa8', insulLo: '#9a6668', board: '#3a2c1e',
    plaster: '#8a8274', plasterHi: '#a29a8a', lath: '#5a4430', crack: '#2a2018', paper: '#6a5a6a', paperHi: '#8a7a8a',
    lip: '#0e0a06', base: '#1e160e', beam: '#4a3a28', beamLine: '#2a2016',
    rim: '#8a7458', rimF: '#a88e6a', rimR: '#5a4a36', ring2: '#3e3226', ring3: '#2e241a',
  }).map(([k, v]) => [k, hex(v)]));

    id: 'attic' + lv, void: '#060402', map: '#b8783c', runner: false, decor: true, attic: true, dust: true, lv, corner, nest,
    ambient: nest ? [0.42, 0.4, 0.44] : corner ? [0.48, 0.44, 0.42] : [0.52, 0.46, 0.4], vignette: 0.55,
    grade: nest ? ['#8a7aa8', 0.1] : ['#c8a070', 0.12],
    floor(x, y, t) {
      if (t.house) return y % 8 === 0 ? P.dropLine : mulc(P.drop, 0.8 + vnoise(x / 5, y / 5) * 0.5); // down the hatch
      // Wide pine boards, nailed at the ends, under dust that lies thickest where nobody walks.
      const row = (y / 8) | 0, xs = x + ((hash2(row, 7) * 48) | 0), lx = xs % 48;
      if (y % 8 === 0 || lx === 0) return mixc(P.seam, P.dust, 0.25);
      let col = lx === 3 && y % 8 === 4 ? P.nail : mulc(mixc(P.pineA, P.pineB, hash2(xs / 48 | 0, row)), 0.86 + vnoise(x / 12, y / 1.5) * 0.22);
      const edge = Math.min(t.u, T - 1 - t.u, t.v, T - 1 - t.v) / (T / 2); // 0 at the tile's rim, 1 in the middle
      const k = 0.32 + (vnoise(x / 14 + 3, y / 14) - 0.5) * 0.5 + (1 - edge) * 0.12 + (nest ? 0.1 : 0);
      col = mixc(col, hash2(x, y) > 0.9 ? P.dustHi : P.dust, Math.max(0, Math.min(0.75, k)));
      if (nest && Math.abs(vnoise(x / 9 + 50, y / 3) - 0.5) < 0.012) col = P.silk; // stray threads of silk
      return col;
    },
    face(x, y, v, F, edge) {
      let col;
      if (v === 0) col = P.lip;
      else if (v === F - 1) col = P.base;
      else if (v === 1) col = P.board; // the roof boards, showing over the top

      }

        const x = c * L.T + 3 + ((hash2(c, r + 2) * (L.T - 8)) | 0), y = r * L.T + 3 + ((hash2(c + 2, r) * (L.T - 8)) | 0), k = hash2(c, r + 9);

        else if (k < 0.6) { g.fillStyle = ['#3a8ad8', '#d84a4a', '#4ab84a'][(c + r) % 3]; g.fillRect(x, y, 2, 2); g.fillStyle = '#ffffff'; g.fillRect(x, y, 1, 1); } // a marble
        else if (k < 0.75) { g.fillStyle = '#7a7470'; g.fillRect(x, y, 3, 1); g.fillRect(x + 2, y - 1, 1, 1); } // a bent nail
        else if (nest) { g.fillStyle = '#d8d8e0'; g.fillRect(x, y, 4, 1); g.fillRect(x + 3, y + 1, 3, 1); }
        else { g.fillStyle = '#8a3a3a'; g.fillRect(x, y, 2, 2); g.fillStyle = '#2a1010'; g.fillRect(x, y, 1, 1); } // a button

// 20F, the top of the tower and the landlord's own rooms: polished black marble inlaid with gold,
// every pillar a sarcophagus, an altar heaped with the rent, or a stand of candles; stained glass and
// tattered banners along the top wall; and in the middle his bone throne on a rune circle, the stolen
// fruit salad in a golden bowl beside it. The room follows the fight: the candles burn in the colour
// of his phase (green, then lilac with cobwebs creeping over the pillars as the spiders come, then red

    cap: '#24202e', capHi: '#2e2838', capVein: '#3e3650',

    id: 'pent', void: '#04020a', map: '#d8cfa8', runner: false, decor: true, pent: true, dust: true,
    ambient: [0.46, 0.42, 0.54], vignette: 0.5, grade: ['#6a4a9a', 0.12],

    if (showEnemies) for (const w of G.wraiths) if (w.state === 'house') pxWraith(w);
    if (showEnemies) for (const g of G.ghosts) if (g !== G.eatenGhost) pxGhost(g);
    if (showEnemies && theme.freezer) frzIceBlocks();
    if (theme.lab) labVat();
    if (theme.boiler) blrFurnace();
    if (showEnemies) for (const h of G.hounds) pxHound(h);
    if (theme.flood) fldHouse(theme);
    if (theme.crypt) cryCrypt();
    if (showEnemies) for (const s of G.slimes) if (s.state !== 'house') pxSlime(s);
    if (showEnemies) for (const w of G.wraiths) if (w.state !== 'house') pxWraith(w);
    if (showEnemies) for (const s of G.blobules) pxSlime({ ...s, state: 'bit', blue: true });
    if (showEnemies) for (const s of G.spiders) pxSpider(s);
    if (showEnemies || (G.boss && G.state === 'clear')) {
      vecBegin();
      if (showEnemies) {
        for (const h of G.hounds) if (h.skid > 0 && h.state === 'hunt') vec(drawSkid, h);
        for (const d of G.drops) vec(drawDropRing, d);
        for (const cp of G.centipedes) vec(drawCentipede, cp);
        for (const s of G.bones) if (!(s.fresh > 0 && Math.floor(G.t * 12) % 2)) vec(drawBone, s.x + 0.5, s.y + 0.5, s.spin + Math.sin(G.t * 9 + s.spin) * 0.5, 1.2);
      }
      if (G.boss && G.boss.state === 'dead' && G.boss.kind !== 'skull') vec(drawBoss, G.boss);
      if (showEnemies) for (const o of G.orbs) vec(drawOrb, o);
      vecEnd();
    }
    if (showEnemies) { pxDrops(); for (const g of G.gargoyles) pxGargoyle(g); }
    if (G.boss && G.boss.kind === 'skull' && (showEnemies || G.state === 'clear')) (G.boss.state === 'dead' ? pxSkullDeath : pxSkull)(G.boss);
    if (G.boss && G.boss.kind !== 'skull' && G.boss.state !== 'dead' && (showEnemies || G.state === 'clear')) (G.boss.kind === 'king' ? pxKing : pxBlob)(G.boss);
    if (showEnemies) {
      for (const m of G.minions) pxGhost({ ...m, frightened: true, eaten: false });
      for (const s of G.buddies) pxGhost({ ...s, dir: s.state === 'saved' ? U : s.dir, panic: true, frightened: false, eaten: s.state === 'saved' });
      for (const v of G.vents) drawSteam(v);
    }
    if (G.reform.quads.length) { // the cloud banks go over everyone in them; Pac-Man stays in sight
      worldTf(); drawReform(); idTf();
      if (reformCover(pac.x + 0.5, pac.y + 0.5) > 0) drawPac();
    }
  }
  if (theme.freezer) frzFog();
  if (theme.lab) labMist(theme);
  if (theme.boiler) blrMist(theme);
  partsStep(dt, theme);
  fbx.restore(); idTf();
  entityLights(showEnemies, pacShown);
  const fl = flashLevel();
  let amb = fl > 0 ? mixc(theme.ambient, [1.25, 1.3, 1.55], fl) : theme.ambient;
  if (theme.freezer) amb = mulc(mixc(amb, [0.8, 0.95, 1.1], frz.ice * 0.4), frzBrown());
  if (theme.lab) amb = labAmbient(amb, theme);
  if (theme.throne) amb = thrAmbient(amb);
  if (theme.boiler) amb = blrAmbient(amb, theme);
  if (theme.flood) amb = fldAmbient(amb, theme);
  if (theme.crypt) amb = cryAmbient(amb);
  if (theme.sewer) amb = sewAmbient(amb);
  if (theme.belfry) amb = belAmbient(amb);
  if (theme.attic) amb = attAmbient(amb);
  if (theme.cloud) amb = cldAmbient(amb, theme);
  if (theme.pent) amb = pentAmbient(amb);
  applyLight(amb, theme.vignette);
  if (theme.decor) { fbx.save(); drawDecor(theme, 0, true); fbx.restore(); }
  if (showEnemies) for (const h of G.hounds) if (h.state !== 'eaten') pxHound(h, true);
  if (theme.dust) drawMotes(dt);
  if (theme.freezer) frzPost(dt);
  if (theme.lab) labPost(dt);
  if (theme.throne) thrPost(dt);
  if (theme.boiler) blrPost(dt, theme);
  if (theme.flood) fldPost(dt, theme);
  if (theme.crypt) cryPost(dt, theme);
  if (theme.sewer) sewPost();
  if (theme.belfry && !cast) belPost(dt, theme);
  if (G.webs.size && !cast) websPost();
  if (theme.cloud && !cast) cldPost(dt, theme);
  if (G.reform.quads.length && enemiesShown() && !cast) reformEyes(); // after the light, so the glare off the clouds doesn't wash them out
  if (G.cfg.dash) dashPost();
  if (enemiesShown()) labTaffy(); // after the light, so the goo glows even under the blacklight
  frostPost();
  magnetPost();
  if (G.vents.length) ventPost(dt, theme);
  if (G.cfg.dark && G.state !== 'clear' && !cast) { fbx.save(); worldTf(); drawDark(); fbx.restore(); idTf(); if (theme.crypt) cryDark(theme); }
  if (fxOn) {
    bloom();
    if (theme.grade) { fbx.globalCompositeOperation = 'soft-light'; fbx.globalAlpha = theme.grade[1]; pr(0, 0, VIEW_W, VIEW_H, theme.grade[0]); fbx.globalCompositeOperation = 'source-over'; fbx.globalAlpha = 1; }
    if (theme.throne && G.boss && G.boss.state !== 'dead' && bossPhase(G.boss) > 1) { fbx.globalCompositeOperation = 'soft-light'; fbx.globalAlpha = 0.14; pr(0, 0, VIEW_W, VIEW_H, bossPhase(G.boss) === 2 ? '#e02cae' : '#ff2a2a'); fbx.globalCompositeOperation = 'source-over'; fbx.globalAlpha = 1; }
    if (theme.lab && G.fright > 0) { fbx.globalCompositeOperation = 'soft-light'; fbx.globalAlpha = 0.2; pr(0, 0, VIEW_W, VIEW_H, '#8a4aff'); fbx.globalCompositeOperation = 'source-over'; fbx.globalAlpha = 1; }
    if (theme.freezer && frz.ice > 0.02) { fbx.globalCompositeOperation = 'soft-light'; fbx.globalAlpha = frz.ice * 0.28; pr(0, 0, VIEW_W, VIEW_H, '#9ff0ff'); fbx.globalCompositeOperation = 'source-over'; fbx.globalAlpha = 1; }
  }
  if (!cast && !G.cfg.dark) drawMinimap(); // no map in the dark: it'd give the whole maze away
  fbx.font = '8px "Press Start 2P", "Courier New", monospace'; fbx.textAlign = 'center'; fbx.textBaseline = 'middle';
  for (const p of G.popups) {
    const x = Math.round((p.x + 0.5) * T - camX), y = Math.round((p.y + 0.5) * T - camY);
    fbx.fillStyle = '#000000'; fbx.fillText(p.text, x + 1, y + 1);
    fbx.fillStyle = p.color; fbx.fillText(p.text, x, y);
  }
  ctx = mainCtx;
}

function render() {
  ctx = mainCtx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (G.state === 'menu') { drawMenu(); return; }
  if (G.state === 'tower') { drawTower(); return; }
  if (G.state === 'ending') { drawEnding(); return; }

  shakeX = G.shake > 0 ? (Math.random() - 0.5) * 0.5 * Math.min(1, G.shake * 2) : 0;
  shakeY = G.shake > 0 ? (Math.random() - 0.5) * 0.5 * Math.min(1, G.shake * 2) : 0;
  renderWorld();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(fb, 0, TOP * px, SCREEN_COLS * px, SCREEN_MAZE_ROWS * px);
  if (fxOn) drawScanlines();
  drawHudPx();
  if (G.state === 'cast') { drawTitle(); return; }
  const showEnemies = enemiesShown();

  if (G.state === 'ready') drawBanner();
  if (G.state === 'clear' && G.timer < 1.2 && !G.cfg.boss) {
    const last = G.lvIndex === LEVELS.length - 1, stageEnd = G.lvIndex < LEVELS.length - 1 && LEVELS[G.lvIndex + 1].stage !== G.cfg.stage;
    text(last ? 'ALL STAGES CLEAR!' : stageEnd ? `STAGE ${G.cfg.stage} CLEAR!` : 'LEVEL CLEAR!', 14, 19.6, '#ffe600', 'center', 0.8);
  }
  if (G.state === 'clear' && G.cfg.boss) {
    screenSpace();
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(2.5, 14.8, 23, 6.6);
    ctx.strokeStyle = '#ffd86b'; ctx.lineWidth = 0.12; ctx.strokeRect(2.5, 14.8, 23, 6.6);
    const kind = G.cfg.boss;
    text(`${BOSSES[kind].name} DEFEATED!`, 14, 15.8, '#ffd86b', 'center', 0.7);
    if (Math.floor(G.t * 3) % 2 === 0) text(kind === 'skull' ? 'YOU WIN!' : 'VICTORY!', 14, 17.6, '#ffe600', 'center', 1);
    text({ king: 'THE FRUIT IS SAVED!', blob: 'THE FRUIT IS SAVED. AGAIN!', skull: 'THE RENT IS PAID IN FULL!' }[kind], 14, 19.6, '#b9bddc', 'center', 0.5);
  }
  if (G.state === 'over') {
    text('GAME  OVER', 14, 19.6, '#ff2a2a', 'center');
    if (G.timer > 1.5 && Math.floor(G.t * 2) % 2 === 0) {
      if (G.cfg.boss && G.lvIndex < ROOF) {
        const def = BOSSES[G.cfg.boss];
        text(`ENTER: RETRY FROM PHASE ${bossPhase({ kind: G.cfg.boss, hp: (save.ck && save.ck[G.lvIndex]) || def.hp })}`, 14, 21.6, '#ffffff', 'center', 0.5);
        text('ESC: BACK TO TOWER', 14, 22.8, '#b9bddc', 'center', 0.45);
      } else text('ENTER: BACK TO TOWER', 14, 21.6, '#ffffff', 'center', 0.55);
    }
  }
  if (G.bossSay && G.boss && G.boss.state !== 'dead' && (showEnemies || G.state === 'phase')) drawBossSay();
  if (G.state === 'phase') {
    const t = 3.4 - G.timer;
    if (t > 0.3 && Math.floor(G.t * 4) % 4 !== 0) {
      screenSpace();
      ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(4, 24.6, 20, 3);
      const def = BOSSES[G.boss.kind], col = def.colors[G.phaseTo];
      const tip = G.boss.kind === 'blob' ? (G.phaseTo === 2 ? 'EAT THE GHOSTS BEFORE IT DOES' : 'EAT THE BITS BEFORE THEY HEAL IT') : def.tips[G.phaseTo];
      ctx.strokeStyle = col; ctx.lineWidth = 0.14; ctx.strokeRect(4, 24.6, 20, 3);
      text(`PHASE ${G.phaseTo}`, 14, 25.1, col, 'center', 1);
      text(tip, 14, 26.5, '#ffffff', 'center', 0.4);
    }
  }
  if (G.state === 'dialog') drawDialog();
  if (G.paused) {
    screenSpace();
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(8, 18.5, 12, 3);
    text('PAUSED', 14, 19.5, '#ffffff', 'center');
  }
}

// ---------- Layout ----------
const main = document.getElementById('main');
const bar = document.getElementById('bar');
const dpad = document.getElementById('dpad');
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const cs = getComputedStyle(main);
  const availW = main.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const dpadH = getComputedStyle(dpad).display !== 'none' ? dpad.offsetHeight + 12 : 0;
  const availH = main.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - bar.offsetHeight - 12 - dpadH;
  const S = Math.max(6, Math.min(availW / SCREEN_COLS, availH / TOTAL_ROWS));
  // Snap to a whole number of device pixels per framebuffer pixel when that costs little, so the
  // pixel art scales evenly.
  let p = S * dpr;
  const k = Math.floor(p / UNIT);
  if (k >= 2 && k * UNIT >= p * 0.82) p = k * UNIT;
  canvas.width = Math.round(p * SCREEN_COLS);
  canvas.height = Math.round(p * TOTAL_ROWS);
  canvas.style.width = (canvas.width / dpr) + 'px';
  canvas.style.height = (canvas.height / dpr) + 'px';
  px = canvas.width / SCREEN_COLS;
}
window.addEventListener('resize', resize);

// ---------- Input ----------
const pauseBtn = document.getElementById('pauseBtn');
const soundBtn = document.getElementById('soundBtn');
function togglePause() {
  if (G.state === 'over' || MENU_STATES.has(G.state)) return;
  G.paused = !G.paused;
  pauseBtn.textContent = G.paused ? 'RESUME' : 'PAUSE';
}
const infBtn = document.getElementById('infBtn');
function setInfinite(on) {
  infinite = on;
  infBtn.textContent = on ? 'INFINITE LIVES: ON' : 'INFINITE LIVES: OFF';
  infBtn.setAttribute('aria-pressed', String(on));
  try { localStorage.setItem('pacman.infinite', on ? '1' : '0'); } catch (e) {}
}
// Testing aid: count the current level as cleared and jump to the next one's intro.
function skipLevel() {
  if (G.state === 'over' || (MENU_STATES.has(G.state) && G.state !== 'dialog')) return;
  if (G.paused) togglePause();
  const i = G.lvIndex;
  if (i >= ROOF) { loadLevel(i + 1); G.state = 'ready'; G.timer = 2; return; }
  recordClear(i, 0);
  startLevel(i + 1);
}
const fxBtn = document.getElementById('fxBtn');
function setFx(on) { // scanlines, bloom, vignette and colour grading
  fxOn = on;
  fxBtn.textContent = on ? 'FX: ON' : 'FX: OFF';
  fxBtn.setAttribute('aria-pressed', String(on));
  try { localStorage.setItem('pacman.fx', on ? '1' : '0'); } catch (e) {}
}
function toggleSound() {
  muted = !muted;
  soundBtn.textContent = muted ? 'SOUND OFF' : 'SOUND ON';
  audioOn();
}
function steer(dir) {
  audioOn();
  if (G.state === 'menu') { if (dir === U || dir === D) menuMove(dir === U ? -1 : 1); return; }
  if (G.state === 'tower') { if (dir === U || dir === D) towerMove(dir === U); return; }
  if (MENU_STATES.has(G.state) || G.state === 'over') return;
  if (G.paused) togglePause();
  if (dir) G.want = dir;
}
function confirmKey() {
  audioOn();
  switch (G.state) {
    case 'menu': menuSelect(); break;
    case 'cast': toMenu(); break;
    case 'tower': towerEnter(); break;
    case 'dialog': dialogNext(); break;
    case 'ending': if (G.timer > 1.5) toTower(ROOF, SKULL_FLOOR); break;
    case 'over':
      if (G.timer <= 1.5) break;
      if (G.lvIndex >= ROOF && G.score > (save.best[ROOF] || 0)) { save.best[ROOF] = G.score; writeSave(); }
      if (G.cfg.boss && G.lvIndex < ROOF) startLevel(G.lvIndex);
      else toTower(Math.min(G.lvIndex, ROOF));
      break;
    default: togglePause();
  }
}
function backKey() {
  if (G.state === 'dialog') endDialog();
  else if (G.state === 'tower' || G.state === 'cast') toMenu();
  else if (G.state === 'over') { if (G.timer > 1.5) toTower(Math.min(G.lvIndex, ROOF)); }
  else if (G.state !== 'menu' && G.state !== 'ending' && G.state !== 'over') togglePause();
}
const KEYS = { ArrowUp: U, ArrowDown: D, ArrowLeft: L, ArrowRight: R, w: U, s: D, a: L, d: R, W: U, S: D, A: L, D: R };
// Directions currently held down, most recent last.
let held = [];
function press(dir) { held = [...held.filter(d => d !== dir), dir]; }
function release(dir) { held = held.filter(d => d !== dir); if (held.length) G.want = held[held.length - 1]; }
window.addEventListener('keydown', e => {
  if (KEYS[e.key]) { e.preventDefault(); if (!e.repeat) press(KEYS[e.key]); steer(KEYS[e.key]); return; }
  if (e.key === ' ' && G.state === 'play' && G.cfg.dash && !G.paused) { e.preventDefault(); triggerDash(); return; }
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); confirmKey(); return; }
  if (e.key === 'Escape') { backKey(); return; }
  if (e.key === 'p' || e.key === 'P') togglePause();
  if (e.key === 'm' || e.key === 'M') toggleSound();
  if (e.key === 'f' || e.key === 'F') setFx(!fxOn);
  if (e.key === 'i' || e.key === 'I') setInfinite(!infinite);
  if (e.key === 'n' || e.key === 'N') skipLevel();
  if ((e.key === 'u' || e.key === 'U') && (G.state === 'tower' || G.state === 'menu')) unlockAll();
});
pauseBtn.addEventListener('click', togglePause);
soundBtn.addEventListener('click', toggleSound);
fxBtn.addEventListener('click', () => setFx(!fxOn));
try { setFx(localStorage.getItem('pacman.fx') !== '0'); } catch (e) { setFx(true); }
infBtn.addEventListener('click', () => setInfinite(!infinite));
document.getElementById('skipBtn').addEventListener('click', skipLevel);
document.getElementById('unlockBtn').addEventListener('click', unlockAll);
try { setInfinite(localStorage.getItem('pacman.infinite') === '1'); } catch (e) { setInfinite(false); }

let swipe = null;
canvas.addEventListener('pointerdown', e => {
  canvas.focus();
  audioOn();
  swipe = { x: e.clientX, y: e.clientY };
  const rect = canvas.getBoundingClientRect();
  const row = (e.clientY - rect.top) / rect.height * TOTAL_ROWS, col = (e.clientX - rect.left) / rect.width * SCREEN_COLS;
  if (G.state === 'menu') {
    const k = Math.floor((row - 16.6) / 2.2);
    if (k >= 0 && k < menuItems().length) {
      if (k !== G.menu.sel) G.menu.confirm = false;
      G.menu.sel = k; menuSelect();
    }
  } else if (G.state === 'tower') {
    const f = floorAt(row + towerCam(G.tower.py));
    if (f === null || !canEnter(f)) return;
    if (f === G.tower.sel) towerEnter(); else { G.tower.sel = f; SFX.tick(); }
  } else if (G.state === 'dialog') {
    if (row > 26.4 && row < 28.4 && col > 19) endDialog(); else dialogNext();
  } else if (G.state === 'cast' || G.state === 'ending' || G.state === 'over') confirmKey();
});
canvas.addEventListener('pointermove', e => {
  if (!swipe || MENU_STATES.has(G.state)) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
  const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? R : L) : (dy > 0 ? D : U);
  if (swipe.dir && swipe.dir !== dir) release(swipe.dir);
  press(dir); steer(dir); // a swipe keeps him moving that way until the finger lifts
  swipe = { x: e.clientX, y: e.clientY, dir };
});
window.addEventListener('keyup', e => { if (KEYS[e.key]) release(KEYS[e.key]); });
window.addEventListener('blur', () => { held = []; });
window.addEventListener('pointerup', () => { if (swipe && swipe.dir) release(swipe.dir); swipe = null; });
const dashBtn = document.getElementById('dashBtn');
// The d-pad centre doubles as an OK button on menus, dialog and the tower.
const menuish = () => MENU_STATES.has(G.state) || G.state === 'over';
dashBtn.addEventListener('pointerdown', e => { e.preventDefault(); if (menuish()) confirmKey(); else triggerDash(); });
dpad.querySelectorAll('button[data-dir]').forEach(b => {
  const dir = DIR_BY_NAME[b.dataset.dir];
  b.addEventListener('pointerdown', e => { e.preventDefault(); press(dir); steer(dir); });
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, () => release(dir));
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && !G.paused && !MENU_STATES.has(G.state) && G.state !== 'over') togglePause();
});

// ---------- Boot ----------
function start(data) {
  if (data && data.hi > hi) { hi = data.hi; saveHi(); }
  window.claude?.hot?.snapshot?.(() => ({ hi }));
  toMenu();
  resize();
  if (document.fonts) document.fonts.load('16px "Press Start 2P"').catch(() => {});
  let last = performance.now(), acc = 0;
  const DT = 1 / 120;
  function frame(now) {
    acc += Math.min(0.1, (now - last) / 1000);
    last = now;
    while (acc >= DT) { update(DT); acc -= DT; }
    render();
    const ok = menuish(), label = ok ? 'OK' : 'DASH';
    const dashOff = !ok && !(G.cfg.dash && G.state === 'play' && G.dashCharge >= 1);
    if (dashBtn.disabled !== dashOff) dashBtn.disabled = dashOff;
    if (dashBtn.textContent !== label) dashBtn.textContent = label;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  canvas.focus({ preventScroll: true });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
