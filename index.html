<title>Pac-Man</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* Layout: one arcade screen, centered in a dark cabinet, controls tucked beneath */
  :root {
    --cab: #07081a;        /* cabinet surround, blue-black */
    --screen: #000000;     /* CRT black */
    --maze: #2a3cff;       /* maze blue */
    --pac: #ffe600;        /* pac yellow */
    --ink: #b9bddc;        /* muted label text */
    --ink-dim: #6b6f93;
    --edge: #1a1d44;
    --display: "Press Start 2P", "Courier New", monospace;
    --mono: "Space Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--cab);
    color: var(--ink);
    font-family: var(--mono);
    overflow: hidden;
  }
  main {
    height: 100%;
    box-sizing: border-box;
    padding-inline: 16px;
    padding-block: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  canvas {
    display: block;
    background: var(--screen);
    border-radius: 6px;
    box-shadow: 0 0 0 1px var(--edge), 0 0 40px rgba(42, 60, 255, 0.18);
    touch-action: none;
    max-width: 100%;
  }
  canvas:focus-visible { outline: 2px solid var(--pac); outline-offset: 3px; }
  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px 18px;
    font-size: 12px;
    letter-spacing: 0.02em;
  }
  .keys { color: var(--ink-dim); }
  kbd {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink);
    border: 1px solid var(--edge);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 5px;
  }
  .btn {
    font-family: var(--display);
    font-size: 9px;
    letter-spacing: 0.08em;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--edge);
    border-radius: 4px;
    padding: 8px 10px;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--maze); color: #fff; }
  .btn:focus-visible { outline: 2px solid var(--pac); outline-offset: 2px; }
  .btn[aria-pressed="true"] { border-color: var(--pac); color: var(--pac); }
  .dpad {
    display: none;
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(3, 52px);
    gap: 4px;
  }
  .dpad button {
    background: var(--edge);
    border: 0;
    border-radius: 10px;
    color: var(--ink);
    font-size: 18px;
    touch-action: none;
  }
  .dpad button:active { background: var(--maze); color: #fff; }
  .dpad .u { grid-area: 1 / 2; } .dpad .l { grid-area: 2 / 1; }
  .dpad .r { grid-area: 2 / 3; } .dpad .d { grid-area: 3 / 2; }
  .dpad .c { grid-area: 2 / 2; font-family: var(--display); font-size: 8px; letter-spacing: 0.05em; }
  .dpad .c:disabled { opacity: 0.35; }
  @media (pointer: coarse) {
    .dpad { display: grid; }
    .keys { display: none; }
  }
</style>

<main id="main">
  <canvas id="game" tabindex="0" aria-label="Pac-Man game. Use arrow keys to move."></canvas>
  <div class="dpad" id="dpad" aria-label="Direction pad">
    <button class="u" data-dir="U" aria-label="Up">▲</button>
    <button class="l" data-dir="L" aria-label="Left">◀</button>
    <button class="r" data-dir="R" aria-label="Right">▶</button>
    <button class="d" data-dir="D" aria-label="Down">▼</button>
    <button class="c" id="dashBtn" type="button" aria-label="Dash" disabled>DASH</button>
  </div>
  <div class="bar" id="bar">
    <span class="keys"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>WASD</kbd> move · <kbd>Enter</kbd> select / next · <kbd>Esc</kbd> back / skip talk · <kbd>P</kbd> pause · <kbd>Space</kbd> dash · <kbd>M</kbd> sound · <kbd>I</kbd> infinite lives · <kbd>N</kbd> skip level · <kbd>U</kbd> unlock all</span>
    <button class="btn" id="pauseBtn" type="button">PAUSE</button>
    <button class="btn" id="soundBtn" type="button">SOUND ON</button>
    <button class="btn" id="infBtn" type="button" aria-pressed="false">INFINITE LIVES: OFF</button>
    <button class="btn" id="skipBtn" type="button">SKIP LEVEL</button>
    <button class="btn" id="unlockBtn" type="button">UNLOCK ALL</button>
  </div>
</main>

    if (dx >= rad || Math.abs(s.y - pac.y) >= rad) continue;

    G.state = 'dying'; G.timer = 0;
    return;

    if (h.state !== 'hunt' || Math.abs(h.x - pac.x) >= 0.6 || Math.abs(h.y - pac.y) >= 0.6) continue;

    G.state = 'dying'; G.timer = 0;
    return;

}

function update(dt) {
  G.t += dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt);
  if (G.paused) return;
  if (G.bossSay && (G.state === 'play' || G.state === 'phase' || G.state === 'ready') && (G.bossSay.t -= dt) <= 0) G.bossSay = null;
  switch (G.state) {
    case 'ready':
      G.timer -= dt;
      if (G.timer <= 0) { G.state = 'play'; if (G.boss && G.boss.hp === BOSSES[G.boss.kind].hp && !G.bossSay) bossTalk(BOSSES[G.boss.kind].lines.start); }
      break;
    case 'play': play(dt); if (G.pendingPhase && G.state === 'play') startPhase(G.pendingPhase); break;
    case 'phase': G.timer -= dt; if (G.timer <= 0) endPhase(); break;
    case 'eatpause':
      G.timer -= dt;
      if (G.timer <= 0) { G.state = 'play'; G.eatenGhost = null; G.popups = G.popups.filter(p => !p.freeze); }
      break;
    case 'dying': {
      const before = G.timer; G.timer += dt;
      if (before < 1 && G.timer >= 1) SFX.death();
      if (G.timer >= 3.2) {
        if (!infinite) G.lives--;
        if (G.lives <= 0) { G.state = 'over'; G.timer = 0; }
        else {
          resetActors();
          if (G.boss) { const t = BOSSES[G.boss.kind].lines.taunt; bossTalk(t[Math.floor(Math.random() * t.length)]); }
          G.globalMode = true; G.globalDots = 0; G.bannerFull = false; G.state = 'ready'; G.timer = 2;
        }
      }
      break;
    }
    case 'clear':
      G.timer += dt;
      if (G.timer >= (G.cfg.boss ? 5.5 : 3)) finishLevel();
      break;
    case 'over': G.timer += dt; break;
    case 'dialog': dialogUpdate(dt); break;
    case 'menu': case 'cast': case 'tower': case 'ending': menuUpdate(dt); break;
  }
}

function drawHUD() {
  const blink = Math.floor(G.t * 3.5) % 2 === 0;
  if (G.state !== 'play' || blink) text('1UP', 3, 0, '#ffffff');
  text('HIGH SCORE', 14, 0, '#ffffff', 'center');
  text(G.score ? String(G.score) : '00', 7, 1, '#ffffff', 'right');
  text(hi ? String(hi) : '00', 17, 1, '#ffffff', 'right');
  if (G.state === 'cast') return;
  const row = TOP + SCREEN_MAZE_ROWS + 0.5;
  screenSpace();
  const spare = Math.max(0, G.lives - 1); // the life on screen isn't a spare, even mid-death
  if (infinite) {
    drawPac(1.6, row, L, 0.5, 0.7);
    text('x INF', 3.6, row, '#ffe600', 'left', 0.55);
  } else {
    for (let i = 0; i < Math.min(spare, 4); i++) drawPac(1.6 + i * 2, row, L, 0.5, 0.7);
  }
  for (let l = G.lvIndex, i = 0; l >= 0 && i < 4; l--, i++) { screenSpace(); drawFruit(fruitFor(l), 25 - i * 2, row); }
  const bdef = G.boss && BOSSES[G.boss.kind], ph = G.boss && (G.state === 'phase' ? G.phaseTo : bossPhase(G.boss));
  const tipped = G.boss && G.boss.kind !== 'king'; // the Blob and the Skeleton King show what each phase wants
  const label = G.lvIndex >= ROOF ? `ROOF ${G.lvIndex - ROOF + 1}` : tipped ? bdef.tips[ph]
    : G.cfg.boss ? 'BOSS FIGHT' : `STAGE ${G.cfg.stage}-${G.cfg.lv}`;
  text(label, 14, row, tipped ? bdef.colors[ph] : STAGE_INK[G.cfg.stage], 'center', 0.55);
  if (G.boss) {
    // Three blocks, one per phase, emptied right to left; the live block blinks its frame.
    // The King's blocks are four hit segments; the Blob's and the Skeleton King's are continuous gauges.
    const per = bdef.per, blob = !!bdef.gauge;
    text(`${bdef.short || bdef.name}  PHASE ${ph}/3`, 0.8, TOP, bdef.colors[ph], 'left', 0.4);
    screenSpace();
    const gx = 10.4, gw = 5.3, gap = 0.5, segs = blob ? 1 : per, segW = gw / segs;
    for (let p = 1; p <= 3; p++) {
      const x0 = gx + (p - 1) * (gw + gap), lo = (3 - p) * per;
      if (blob) {
        const fill = hp => Math.max(0, Math.min(1, (hp - lo) / per)) * (gw - 0.12);
        const f = fill(G.boss.hp - pieceRisk(G.boss)), fr = fill(G.boss.hp); // fr - f: health the loose pieces carry
        ctx.fillStyle = '#1a1d44'; ctx.fillRect(x0 + 0.06, TOP + 0.28, gw - 0.12, 0.44);
        ctx.fillStyle = bdef.colors[p]; ctx.fillRect(x0 + 0.06, TOP + 0.28, f, 0.44);
        if (fr > f && Math.floor(G.t * 6) % 2) { ctx.fillStyle = '#ffffff'; ctx.fillRect(x0 + 0.06 + f, TOP + 0.28, fr - f, 0.44); }
      } else for (let k = 0; k < segs; k++) {
        const hpIdx = lo + per - k; // HP value this segment stands for
        ctx.fillStyle = G.boss.hp >= hpIdx ? bdef.colors[p] : '#1a1d44';
        ctx.fillRect(x0 + k * segW + 0.06, TOP + 0.28, segW - 0.12, 0.44);
      }
      if (p === ph && G.boss.hp > 0 && Math.floor(G.t * 3) % 2 === 0) {
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 0.08; ctx.strokeRect(x0 - 0.08, TOP + 0.18, gw + 0.16, 0.64);
      }
    }
  }
  if (G.cfg.dash) {
    const full = G.dashCharge >= 1;
    text('DASH', 27, 0, full ? '#ffe600' : '#6b6f93', 'right', 0.6);
    screenSpace();
    ctx.fillStyle = '#1a1d44'; ctx.fillRect(21, 1.2, 6, 0.6);
    ctx.fillStyle = full ? (blink ? '#ffe600' : '#fff3a0') : '#8f9bff';
    ctx.fillRect(21, 1.2, 6 * G.dashCharge, 0.6);
  }
}

function drawTitle() {
  screenSpace();
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(1, TOP + 2.2, 26, 24.4);
  const blink = Math.floor(G.t * 2) % 2 === 0;
  text('CHARACTER / NICKNAME', 14, TOP + 3, '#ffffff', 'center', 0.62);
  const at = row => ({ x: 3.5, y: row, dir: R });
  const cast = [

// ---------- Story screens ----------
// Draws with G.fright forced on, so sprites show their blue frightened face.
function withFright(on, fn) { const f = G.fright; if (on) G.fright = 5; fn(); G.fright = f; }
const STARS = (() => {
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  return Array.from({ length: 46 }, () => ({ x: rnd() * 28, y: 2.5 + rnd() * 27, z: rnd() < 0.2 ? 0.2 : 0.12, p: Math.floor(rnd() * 5), c: rnd() < 0.3 ? '#8f9bff' : '#ffffff' }));
})();
function drawSky(moon = true) {
  screenSpace();
  for (const s of STARS) {
    if ((Math.floor(G.t * 2) + s.p) % 7 === 0) continue;
    ctx.fillStyle = s.c; ctx.fillRect(s.x, s.y, s.z, s.z);
  }
  if (!moon) return;
  ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.arc(3.6, 5.6, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000000'; ctx.beginPath(); ctx.arc(4.3, 5.1, 1.3, 0, Math.PI * 2); ctx.fill();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
// Draws one character sprite centered on (cx, cy) in screen tiles, at scale k.
function drawCharacter(who, mood, cx, cy, k, face = R, open = 0.4) {
  const sp = SPEAKERS[who];
  screenSpace();
  ctx.save();
  ctx.translate(cx, cy);
  if (who === 'KING' || who === 'SKULL') { ctx.scale(k * 0.5, k * 0.5); ctx.translate(0, 0.45); }
  else if (who === 'BLOB') { ctx.scale(k * 0.42, k * 0.42); ctx.translate(0, 0.3); }
  else if (who === 'GARGOYLE') { ctx.scale(k * 0.9, k * 0.9); ctx.translate(0, 0.2); }
  else ctx.scale(k, k);
  const at = { x: -0.5, y: -0.5 };
  withFright(mood === 'scared', () => {
    if (who === 'PAC') drawPac(at.x, at.y, face, open);
    else if (sp.ghost !== undefined) drawGhost({ ...at, dir: face, color: sp.color, frightened: mood === 'scared', eaten: false });
    else if (who === 'WRAITH') drawWraith({ ...at, state: 'active', dir: face });
    else if (who === 'SLIME') drawSlime({ kind: 'big', ...at, dir: face, state: 'active', group: 0 });
    else if (who === 'KING') drawBoss({ ...at, kind: 'king', state: 'chase', hp: mood === 'angry' ? 1 : BOSSES.king.hp, inv: 0 });
    else if (who === 'BLOB') drawBlob({ ...at, kind: 'blob', state: 'chase', hp: BOSSES.blob.hp, look: mood === 'angry' ? 3 : 1, inv: 0, flash: 0, eaten: [] });
    else if (who === 'HOUND') drawHound({ ...at, dir: face, state: 'hunt', sniff: mood === 'sniff' ? 1 : 0 });
    else if (who === 'GARGOYLE') drawGargoyle({ ...at, dir: D, state: 'active', moving: mood === 'angry' });
    else if (who === 'SPIDER') drawSpider({ ...at, dir: face, state: 'active', fresh: 0 });
    else if (who === 'SKULL') drawSkull({ ...at, kind: 'skull', state: mood === 'scared' ? 'pile' : 'chase', hp: BOSSES.skull.hp, look: mood === 'angry' ? 3 : 1, inv: 0 });

}
function wrapText(s, maxW, size) {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.font = Math.round(px * size) + FONT;
  const out = []; let cur = '';

    const t = cur ? cur + ' ' + w : w;
    if (cur && ctx.measureText(t).width > maxW * px) { out.push(cur); cur = w; } else cur = t;
  }
  if (cur) out.push(cur);
  ctx.restore();
  return out;
}

function drawDialog() {
  const d = G.dlg, [who, msg, mood] = d.lines[d.i], sp = SPEAKERS[who];

  screenSpace();

    left -= l.length + 1;

    ctx.beginPath(); ctx.moveTo(ax - 0.35, ay - 0.2); ctx.lineTo(ax + 0.35, ay - 0.2); ctx.lineTo(ax, ay + 0.25); ctx.fill();
  }
}

// A lap of Pac-Man chased by the cast, then a lap chasing the blue ghosts back, like the attract mode.
function drawParade(row, speed = 7) {
  const lap = 52, p = (G.t * speed) % (lap * 2), chase = p < lap;
  const open = (1 - Math.cos(G.t * 18)) / 2;
  if (chase) {
    const x = p - 2, crew = ['BLINKY', 'PINKY', 'INKY', 'CLYDE', 'WRAITH', 'SLIME'];
    drawCharacter('PAC', null, x, row, 1, R, open);
    crew.forEach((c, k) => drawCharacter(c, null, x - 2.3 * (k + 1), row, 1, R));
  } else {
    const x = 43 - (p - lap);
    drawCharacter('PAC', null, x, row, 1, L, open);
    ['BLINKY', 'PINKY', 'INKY', 'CLYDE'].forEach((c, k) => drawCharacter(c, 'scared', x - 2.3 * (k + 1), row, 1, L));
  }
}

function drawIconStar(cx, cy, r, color) {
  ctx.fillStyle = color; ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }

}
function drawIconLock(cx, cy, color) {

  ctx.fillStyle = color; ctx.fillRect(cx - 0.34, cy - 0.12, 0.68, 0.5);

const PEBBLES = (() => {

})();
function drawTower() {
  drawSky();

  const Y = y => y - cam;
  screenSpace();
  ctx.save();
  ctx.beginPath(); ctx.rect(0, VIEW_TOP, SCREEN_COLS, VIEW_BOT - VIEW_TOP); ctx.clip();

  ctx.fillStyle = '#2a1a10';
  for (const p of PEBBLES) ctx.fillRect(p.x, gy + p.y, p.w, p.w * 0.6);
  if (open) {
    const bot = Y(floorTop(BLOB_FLOOR) + FLOOR_H);
    ctx.fillStyle = '#000000'; ctx.fillRect(TOWER_X - 0.3, gy, TOWER_W + 0.6, bot - gy + 0.3);
    ctx.fillStyle = '#3a2418'; ctx.fillRect(TOWER_X - 0.5, gy, 0.2, bot - gy + 0.3); ctx.fillRect(TOWER_X + TOWER_W + 0.3, gy, 0.2, bot - gy + 0.3);
    // Pipes run down the shaft; the sewer pools at the bottom.
    ctx.fillStyle = '#58b82e'; ctx.fillRect(TOWER_X - 1.5, gy + 1, 0.35, bot - gy - 1);
    ctx.fillStyle = '#1f6f8b'; ctx.fillRect(TOWER_X - 0.5, bot + 0.3, TOWER_W + 1, 0.5);
    const drip = (G.t * 6) % 12;
    ctx.fillStyle = '#9be86f'; ctx.fillRect(TOWER_X - 1.4, gy + 1 + drip * (bot - gy - 1) / 12, 0.15, 0.3);
  }
  ctx.fillStyle = '#1a1d44'; ctx.fillRect(0, gy + 0.05, SCREEN_COLS, 0.18);
  if (skyOpen()) { // clouds drift past the sky floors
    ctx.fillStyle = '#141738';
    for (let k = 0; k < 6; k++) {

      for (const [dx, dy, r] of [[0, 0, 0.9], [1, -0.4, 1.1], [2.1, 0, 0.8]]) { ctx.beginPath(); ctx.arc(x + dx, y + dy, r, 0, Math.PI * 2); ctx.fill(); }
    }
  }

  text(sel >= ROOF ? 'THE ROOF' : `${floorLabel(sel)}  ${FLOOR_NAMES[sel]}`, 14, 32.1, ink, 'center', 0.62);
  text(sel >= ROOF ? 'ENDLESS BONUS ROUNDS' : `STAGE ${st}: ${STAGE_NAMES[st]}`, 14, 33.25, '#b9bddc', 'center', 0.4);
  const best = save.best[sel] || 0;
  text(best ? `BEST ${best}` : (isCleared(sel) ? 'CLEARED' : 'NOT CLEARED YET'), 14, 34.2, '#6b6f93', 'center', 0.38);
  const coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  text(coarse ? 'TAP A FLOOR, TAP AGAIN TO PLAY' : 'UP/DOWN MOVE  ENTER PLAY  ESC MENU', 14, 35.2, '#6b6f93', 'center', 0.34);
}

function drawEnding() {
  drawSky();
  text('THE END', 14.2, 4.7, '#2a3cff', 'center', 1.9);
  text('THE END', 14, 4.5, '#ffe600', 'center', 1.9);
  text('THE FRUIT IS HOME. FOR GOOD.', 14, 8, '#ffffff', 'center', 0.55);
  text('THE LANDLORD WAIVED THE RENT.', 14, 9.3, '#b9bddc', 'center', 0.42);
  // Victory lap: Pac-Man leads, the fruit follows, the whole cast tags along happily.
  const x = (G.t * 5) % 66 - 4;
  drawCharacter('PAC', null, x, 14, 1, R, (1 - Math.cos(G.t * 18)) / 2);
  FRUITS.slice(0, 5).forEach((f, k) => { screenSpace(); drawFruit(f, x - 2 - k * 1.6 - 0.5, 13.5); });
  ['BLINKY', 'PINKY', 'INKY', 'CLYDE', 'WRAITH', 'SLIME', 'HOUND', 'GARGOYLE', 'SPIDER'].forEach((c, k) => drawCharacter(c, null, x - 11 - k * 2.3, 14, 1, R));
  const bob = Math.floor(G.t * 3) % 2 ? 0.15 : 0;
  drawCharacter('KING', 'scared', 6, 20 + bob, 1.3);
  drawCharacter('SKULL', null, 14, 19.8 - bob, 1.3);
  drawCharacter('BLOB', 'scared', 22, 20.2 + bob, 1.3);
  text('THE KING, THE BLOB AND THE LANDLORD', 14, 24, '#ffd86b', 'center', 0.42);
  text('NOW SHARE A SMOOTHIE.', 14, 25.2, '#ffd86b', 'center', 0.42);
  text('ROOF UNLOCKED: ENDLESS MODE', 14, 27.8, '#ffe600', 'center', 0.5);
  text('THANKS FOR PLAYING!', 14, 29.4, '#ff4fa3', 'center', 0.55);
  if (G.timer > 1.5 && Math.floor(G.t * 2) % 2 === 0) text('PRESS ENTER', 14, 32.5, '#ffffff', 'center', 0.6);
}

// Comic speech bubble over the King, flipped below him near the top wall and kept on screen.
function drawBossSay() {
  const b = G.boss, size = 0.42, lines = wrapText(G.bossSay.text, 11, size);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.font = Math.round(px * size) + FONT;
  const w = Math.max(...lines.map(l => ctx.measureText(l).width / px)) + 1.1;
  ctx.restore();
  const h = lines.length * 0.72 + 0.7;
  const cx = ox + b.x + 0.5, top = oy + b.y - (b.kind === 'blob' ? blobR(b) * 0.86 + 0.6 : 2.6);
  const below = top - h < TOP + 1.2;
  const by = below ? oy + b.y + (b.kind === 'blob' ? blobR(b) + 0.4 : 2.4) : top - h;
  const bx = Math.max(0.4, Math.min(SCREEN_COLS - 0.4 - w, cx - w / 2));
  const pop = G.bossSay.t > 2.45 && G.state !== 'phase' ? 0.6 : 1; // tiny pop-in
  screenSpace();
  ctx.save();
  ctx.translate(cx, below ? by : by + h); ctx.scale(pop, pop); ctx.translate(-cx, -(below ? by : by + h));
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#000000'; ctx.lineWidth = 0.1;
  roundRect(bx, by, w, h, 0.35); ctx.fill();
  const tx = Math.max(bx + 0.5, Math.min(bx + w - 0.5, cx));
  ctx.beginPath();
  if (below) { ctx.moveTo(tx - 0.35, by + 0.05); ctx.lineTo(tx, by - 0.55); ctx.lineTo(tx + 0.35, by + 0.05); }
  else { ctx.moveTo(tx - 0.35, by + h - 0.05); ctx.lineTo(tx, by + h + 0.55); ctx.lineTo(tx + 0.35, by + h - 0.05); }
  ctx.fill();
  ctx.restore();
  if (pop < 1) return;
  lines.forEach((l, j) => text(l, bx + w / 2, by + 0.35 + j * 0.72 - 0.14, '#1a0010', 'center', size));
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (G.state === 'menu') { drawMenu(); return; }
  if (G.state === 'tower') { drawTower(); return; }
  if (G.state === 'ending') { drawEnding(); return; }
  drawHUD();

  const stageColor = WALL_COLORS[G.cfg.stage];
  shakeX = G.shake > 0 ? (Math.random() - 0.5) * 0.5 * Math.min(1, G.shake * 2) : 0;
  shakeY = G.shake > 0 ? (Math.random() - 0.5) * 0.5 * Math.min(1, G.shake * 2) : 0;
  const flash = G.state === 'clear' && G.timer > 1 && Math.floor((G.timer - 1) / 0.22) % 2 === 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(mazeArt(G.cfg.maze, flash ? '#ffffff' : stageColor), (ox + shakeX) * px, (oy + shakeY) * px, W * px, H * px);

  mazeSpace();
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  if (G.state !== 'clear' && M.some(r => r.includes('-'))) { ctx.fillStyle = '#ffb8ff'; ctx.fillRect(house.doorC, house.exitY + 1.38, 2, 0.24); }
  if (hasFlow && G.state !== 'cast') drawWater();
  if (G.state !== 'cast') for (const v of G.vents) drawVentGrate(v);

  const pelletOn = G.state !== 'play' || Math.floor(G.t * 5) % 2 === 0;
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const v = G.dots[r * W + c];
    if (v === 1) { ctx.fillStyle = '#ffb8ae'; ctx.fillRect(c + 0.375, r + 0.375, 0.25, 0.25); }
    else if (v === 2 && pelletOn) { ctx.fillStyle = '#ffb8ae'; ctx.beginPath(); ctx.arc(c + 0.5, r + 0.5, 0.42, 0, Math.PI * 2); ctx.fill(); }
    else if (v === 3) drawFrostBerry(c + 0.5, r + 0.5, 1.1);
    else if (v === 5) drawMagnet(c + 0.5, r + 0.55);
  }

  if (G.state === 'cast') { ctx.restore(); drawTitle(); return; }

  if (G.webs.size) drawWebs();
  if (G.fruit) drawFruit(G.fruit.kind, meta.fruit.x, meta.fruit.y);
  drawReform();
  if (G.magnet > 0 && (G.magnet > 1.5 || Math.floor(G.t * 8) % 2)) { // the pull radius, spinning
    ctx.save(); ctx.strokeStyle = '#ff5a5a'; ctx.lineWidth = 0.08; ctx.setLineDash([0.4, 0.35]); ctx.lineDashOffset = -G.t * 3;
    ctx.beginPath(); ctx.arc(pac.x + 0.5, pac.y + 0.5, MAGNET_R, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
  for (const f of G.flyDots) { // pulled dots zipping into Pac-Man
    const k = f.t / MAGNET_FLY;
    ctx.fillStyle = '#ffb8ae';
    ctx.fillRect(f.x + (pac.x - f.x) * k + 0.375, f.y + (pac.y - f.y) * k + 0.375, 0.25, 0.25);
  }
  if (G.chill > 0) {
    ctx.strokeStyle = '#bdf4ff'; ctx.lineWidth = 0.08;
    const k = 0.3 + (Math.floor(G.t * 6) % 2) * 0.12;
    for (const w of G.wraiths) if (w.reach && (w.state === 'active' || w.state === 'leave')) for (const t of w.reach) {
      ctx.beginPath();
      ctx.moveTo(t.x + 0.5 - k, t.y + 0.5); ctx.lineTo(t.x + 0.5 + k, t.y + 0.5);
      ctx.moveTo(t.x + 0.5, t.y + 0.5 - k); ctx.lineTo(t.x + 0.5, t.y + 0.5 + k);
      ctx.stroke();
    }
  }

  const showEnemies = G.state === 'ready' || G.state === 'phase' || (G.state === 'dialog' && G.dlg.then === 'ready') || G.state === 'play' || G.state === 'eatpause' || (G.state === 'dying' && G.timer < 1) || (G.state === 'clear' && G.timer < 1);
  if (showEnemies) for (const h of G.hounds) drawScent(h);
  if (G.state === 'dying') {
    if (G.timer < 1) drawPac(pac.x, pac.y, pac.face, 0.4);
    else drawPacDeath(pac.x, pac.y, (G.timer - 1) / 1.4);
  } else if (G.state !== 'over' && G.state !== 'eatpause') {
    const open = G.state === 'ready' || G.state === 'dialog' ? 0 : (1 - Math.cos(pac.anim * Math.PI * 2 * 0.8)) / 2;
    ctx.save();
    pac.trail.forEach((t, i) => {
      if (i % 2 || Math.abs(t.x - pac.x) > 5) return;
      ctx.globalAlpha = 0.45 * (1 - i / pac.trail.length);
      drawPac(t.x, t.y, pac.face, open);
    });
    ctx.restore();
    drawPac(pac.x, pac.y, pac.face, G.state === 'clear' ? 0 : open);
  }
  if (showEnemies) {
    for (const s of G.slimes) if (s.state === 'house') drawSlime(s); // house-bound ones sit behind the ghosts
    for (const w of G.wraiths) if (w.state === 'house') drawWraith(w);
    for (const g of G.ghosts) if (g !== G.eatenGhost) drawGhost(g);
    for (const s of G.slimes) if (s.state !== 'house') drawSlime(s);
    for (const w of G.wraiths) if (w.state !== 'house') drawWraith(w);
    for (const m of G.minions) drawGhost({ ...m, frightened: true, eaten: false });
    for (const h of G.hounds) drawHound(h);
    for (const s of G.spiders) drawSpider(s);
    for (const d of G.drops) drawDrop(d);
    for (const cp of G.centipedes) drawCentipede(cp);
    for (const g of G.gargoyles) drawGargoyle(g);
    for (const s of G.bones) if (!(s.fresh > 0 && Math.floor(G.t * 12) % 2)) drawBone(s.x + 0.5, s.y + 0.5, s.spin + Math.sin(G.t * 9 + s.spin) * 0.5, 1.2);
    for (const s of G.blobules) drawSlime({ ...s, state: 'bit', blue: true });
    for (const s of G.buddies) drawGhost({ ...s, dir: s.state === 'saved' ? U : s.dir, panic: true, frightened: false, eaten: s.state === 'saved' });
  }
  if (G.boss && (showEnemies || G.state === 'clear')) drawBoss(G.boss);
  if (showEnemies) {
    for (const o of G.orbs) drawOrb(o);
    for (const v of G.vents) drawSteam(v);
  }
  if (G.cfg.dark && G.state !== 'clear') drawDark();
  ctx.restore();

  for (const p of G.popups) text(p.text, ox + p.x + 0.5, oy + p.y, p.color, 'center', 0.55);
  if (G.state === 'ready') drawBanner();
  if (G.state === 'clear' && G.timer < 1.2 && !G.cfg.boss) {
    const last = G.lvIndex === LEVELS.length - 1, stageEnd = G.lvIndex < LEVELS.length - 1 && LEVELS[G.lvIndex + 1].stage !== G.cfg.stage;
    text(last ? 'ALL STAGES CLEAR!' : stageEnd ? `STAGE ${G.cfg.stage} CLEAR!` : 'LEVEL CLEAR!', 14, 19.6, '#ffe600', 'center', 0.8);
  }
  if (G.state === 'clear' && G.cfg.boss) {
    screenSpace();
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(2.5, 14.8, 23, 6.6);
    ctx.strokeStyle = '#ffd86b'; ctx.lineWidth = 0.12; ctx.strokeRect(2.5, 14.8, 23, 6.6);
    const kind = G.cfg.boss;
    text(`${BOSSES[kind].name} DEFEATED!`, 14, 15.8, '#ffd86b', 'center', 0.7);
    if (Math.floor(G.t * 3) % 2 === 0) text(kind === 'skull' ? 'YOU WIN!' : 'VICTORY!', 14, 17.6, '#ffe600', 'center', 1);
    text({ king: 'THE FRUIT IS SAVED!', blob: 'THE FRUIT IS SAVED. AGAIN!', skull: 'THE RENT IS PAID IN FULL!' }[kind], 14, 19.6, '#b9bddc', 'center', 0.5);
  }
  if (G.state === 'over') {
    text('GAME  OVER', 14, 19.6, '#ff2a2a', 'center');
    if (G.timer > 1.5 && Math.floor(G.t * 2) % 2 === 0) {
      if (G.cfg.boss && G.lvIndex < ROOF) {
        const def = BOSSES[G.cfg.boss];
        text(`ENTER: RETRY FROM PHASE ${bossPhase({ kind: G.cfg.boss, hp: (save.ck && save.ck[G.lvIndex]) || def.hp })}`, 14, 21.6, '#ffffff', 'center', 0.5);
        text('ESC: BACK TO TOWER', 14, 22.8, '#b9bddc', 'center', 0.45);
      } else text('ENTER: BACK TO TOWER', 14, 21.6, '#ffffff', 'center', 0.55);
    }
  }
  if (G.bossSay && G.boss && G.boss.state !== 'dead' && (showEnemies || G.state === 'phase')) drawBossSay();
  if (G.state === 'phase') {
    const t = 3.4 - G.timer;
    if (t > 0.3 && Math.floor(G.t * 4) % 4 !== 0) {
      screenSpace();
      ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(4, 24.6, 20, 3);
      const def = BOSSES[G.boss.kind], col = def.colors[G.phaseTo];
      const tip = G.boss.kind === 'blob' ? (G.phaseTo === 2 ? 'EAT THE GHOSTS BEFORE IT DOES' : 'EAT THE BITS BEFORE THEY HEAL IT') : def.tips[G.phaseTo];
      ctx.strokeStyle = col; ctx.lineWidth = 0.14; ctx.strokeRect(4, 24.6, 20, 3);
      text(`PHASE ${G.phaseTo}`, 14, 25.1, col, 'center', 1);
      text(tip, 14, 26.5, '#ffffff', 'center', 0.4);
    }
  }
  if (G.state === 'dialog') drawDialog();
  if (G.paused) {
    screenSpace();
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(8, 18.5, 12, 3);
    text('PAUSED', 14, 19.5, '#ffffff', 'center');
  }
}

// ---------- Layout ----------
const main = document.getElementById('main');
const bar = document.getElementById('bar');
const dpad = document.getElementById('dpad');
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const cs = getComputedStyle(main);
  const availW = main.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const dpadH = getComputedStyle(dpad).display !== 'none' ? dpad.offsetHeight + 12 : 0;
  const availH = main.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - bar.offsetHeight - 12 - dpadH;
  const S = Math.max(6, Math.min(availW / SCREEN_COLS, availH / TOTAL_ROWS));
  canvas.style.width = (S * SCREEN_COLS) + 'px';
  canvas.style.height = (S * TOTAL_ROWS) + 'px';
  canvas.width = Math.round(S * SCREEN_COLS * dpr);
  canvas.height = Math.round(S * TOTAL_ROWS * dpr);
  px = canvas.width / SCREEN_COLS;
}
window.addEventListener('resize', resize);

// ---------- Input ----------
const pauseBtn = document.getElementById('pauseBtn');
const soundBtn = document.getElementById('soundBtn');
function togglePause() {
  if (G.state === 'over' || MENU_STATES.has(G.state)) return;
  G.paused = !G.paused;
  pauseBtn.textContent = G.paused ? 'RESUME' : 'PAUSE';
}
const infBtn = document.getElementById('infBtn');
function setInfinite(on) {
  infinite = on;
  infBtn.textContent = on ? 'INFINITE LIVES: ON' : 'INFINITE LIVES: OFF';
  infBtn.setAttribute('aria-pressed', String(on));
  try { localStorage.setItem('pacman.infinite', on ? '1' : '0'); } catch (e) {}
}
// Testing aid: count the current level as cleared and jump to the next one's intro.
function skipLevel() {
  if (G.state === 'over' || (MENU_STATES.has(G.state) && G.state !== 'dialog')) return;
  if (G.paused) togglePause();
  const i = G.lvIndex;
  if (i >= ROOF) { loadLevel(i + 1); G.state = 'ready'; G.timer = 2; return; }
  recordClear(i, 0);
  startLevel(i + 1);
}
function toggleSound() {
  muted = !muted;
  soundBtn.textContent = muted ? 'SOUND OFF' : 'SOUND ON';
  audioOn();
}
function steer(dir) {
  audioOn();
  if (G.state === 'menu') { if (dir === U || dir === D) menuMove(dir === U ? -1 : 1); return; }
  if (G.state === 'tower') { if (dir === U || dir === D) towerMove(dir === U); return; }
  if (MENU_STATES.has(G.state) || G.state === 'over') return;
  if (G.paused) togglePause();
  if (dir) G.want = dir;
}
function confirmKey() {
  audioOn();
  switch (G.state) {
    case 'menu': menuSelect(); break;
    case 'cast': toMenu(); break;
    case 'tower': towerEnter(); break;
    case 'dialog': dialogNext(); break;
    case 'ending': if (G.timer > 1.5) toTower(ROOF, SKULL_FLOOR); break;
    case 'over':
      if (G.timer <= 1.5) break;
      if (G.lvIndex >= ROOF && G.score > (save.best[ROOF] || 0)) { save.best[ROOF] = G.score; writeSave(); }
      if (G.cfg.boss && G.lvIndex < ROOF) startLevel(G.lvIndex);
      else toTower(Math.min(G.lvIndex, ROOF));
      break;
    default: togglePause();
  }
}
function backKey() {
  if (G.state === 'dialog') endDialog();
  else if (G.state === 'tower' || G.state === 'cast') toMenu();
  else if (G.state === 'over') { if (G.timer > 1.5) toTower(Math.min(G.lvIndex, ROOF)); }
  else if (G.state !== 'menu' && G.state !== 'ending' && G.state !== 'over') togglePause();
}
const KEYS = { ArrowUp: U, ArrowDown: D, ArrowLeft: L, ArrowRight: R, w: U, s: D, a: L, d: R, W: U, S: D, A: L, D: R };
window.addEventListener('keydown', e => {
  if (KEYS[e.key]) { e.preventDefault(); steer(KEYS[e.key]); return; }
  if (e.key === ' ' && G.state === 'play' && G.cfg.dash && !G.paused) { e.preventDefault(); triggerDash(); return; }
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); confirmKey(); return; }
  if (e.key === 'Escape') { backKey(); return; }
  if (e.key === 'p' || e.key === 'P') togglePause();
  if (e.key === 'm' || e.key === 'M') toggleSound();
  if (e.key === 'i' || e.key === 'I') setInfinite(!infinite);
  if (e.key === 'n' || e.key === 'N') skipLevel();
  if ((e.key === 'u' || e.key === 'U') && (G.state === 'tower' || G.state === 'menu')) unlockAll();
});
pauseBtn.addEventListener('click', togglePause);
soundBtn.addEventListener('click', toggleSound);
infBtn.addEventListener('click', () => setInfinite(!infinite));
document.getElementById('skipBtn').addEventListener('click', skipLevel);
document.getElementById('unlockBtn').addEventListener('click', unlockAll);
try { setInfinite(localStorage.getItem('pacman.infinite') === '1'); } catch (e) { setInfinite(false); }

let swipe = null;
canvas.addEventListener('pointerdown', e => {
  canvas.focus();
  audioOn();
  swipe = { x: e.clientX, y: e.clientY };
  const rect = canvas.getBoundingClientRect();
  const row = (e.clientY - rect.top) / rect.height * TOTAL_ROWS, col = (e.clientX - rect.left) / rect.width * SCREEN_COLS;
  if (G.state === 'menu') {
    const k = Math.floor((row - 16.6) / 2.2);
    if (k >= 0 && k < menuItems().length) {
      if (k !== G.menu.sel) G.menu.confirm = false;
      G.menu.sel = k; menuSelect();
    }
  } else if (G.state === 'tower') {
    const f = floorAt(row + towerCam(G.tower.py));
    if (f === null || !canEnter(f)) return;
    if (f === G.tower.sel) towerEnter(); else { G.tower.sel = f; SFX.tick(); }
  } else if (G.state === 'dialog') {
    if (row > 26.4 && row < 28.4 && col > 19) endDialog(); else dialogNext();
  } else if (G.state === 'cast' || G.state === 'ending' || G.state === 'over') confirmKey();
});
canvas.addEventListener('pointermove', e => {
  if (!swipe || MENU_STATES.has(G.state)) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
  steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? R : L) : (dy > 0 ? D : U));
  swipe = { x: e.clientX, y: e.clientY };
});
window.addEventListener('pointerup', () => { swipe = null; });
const dashBtn = document.getElementById('dashBtn');
// The d-pad centre doubles as an OK button on menus, dialog and the tower.
const menuish = () => MENU_STATES.has(G.state) || G.state === 'over';
dashBtn.addEventListener('pointerdown', e => { e.preventDefault(); if (menuish()) confirmKey(); else triggerDash(); });
dpad.querySelectorAll('button[data-dir]').forEach(b => {
  b.addEventListener('pointerdown', e => { e.preventDefault(); steer(DIR_BY_NAME[b.dataset.dir]); });
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && !G.paused && !MENU_STATES.has(G.state) && G.state !== 'over') togglePause();
});

// ---------- Boot ----------
function start(data) {
  if (data && data.hi > hi) { hi = data.hi; saveHi(); }
  window.claude?.hot?.snapshot?.(() => ({ hi }));
  toMenu();
  resize();
  if (document.fonts) document.fonts.load('16px "Press Start 2P"').catch(() => {});
  let last = performance.now(), acc = 0;
  const DT = 1 / 120;
  function frame(now) {
    acc += Math.min(0.1, (now - last) / 1000);
    last = now;
    while (acc >= DT) { update(DT); acc -= DT; }
    render();
    const ok = menuish(), label = ok ? 'OK' : 'DASH';
    const dashOff = !ok && !(G.cfg.dash && G.state === 'play' && G.dashCharge >= 1);
    if (dashBtn.disabled !== dashOff) dashBtn.disabled = dashOff;
    if (dashBtn.textContent !== label) dashBtn.textContent = label;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  canvas.focus({ preventScroll: true });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
