<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pac-Man</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* Layout: one arcade screen, centered in a dark cabinet, controls tucked beneath */
  :root {
    --cab: #07081a;        /* cabinet surround, blue-black */
    --screen: #000000;     /* CRT black */
    --maze: #2a3cff;       /* maze blue */
    --pac: #ffe600;        /* pac yellow */
    --ink: #b9bddc;        /* muted label text */
    --ink-dim: #6b6f93;
    --edge: #1a1d44;
    --display: "Press Start 2P", "Courier New", monospace;
    --mono: "Space Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--cab);
    color: var(--ink);
    font-family: var(--mono);
    overflow: hidden;
  }
  main {
    height: 100%;
    box-sizing: border-box;
    padding-inline: 16px;
    padding-block: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  canvas {
    display: block;
    background: var(--screen);
    border-radius: 6px;
    box-shadow: 0 0 0 1px var(--edge), 0 0 40px rgba(42, 60, 255, 0.18);
    touch-action: none;
    max-width: 100%;
  }
  canvas:focus-visible { outline: 2px solid var(--pac); outline-offset: 3px; }
  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px 18px;
    font-size: 12px;
    letter-spacing: 0.02em;
  }
  .keys { color: var(--ink-dim); }
  kbd {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink);
    border: 1px solid var(--edge);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 5px;
  }
  .btn {
    font-family: var(--display);
    font-size: 9px;
    letter-spacing: 0.08em;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--edge);
    border-radius: 4px;
    padding: 8px 10px;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--maze); color: #fff; }
  .btn:focus-visible { outline: 2px solid var(--pac); outline-offset: 2px; }
  .btn[aria-pressed="true"] { border-color: var(--pac); color: var(--pac); }
  .dpad {
    display: none;
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(3, 52px);
    gap: 4px;
  }
  .dpad button {
    background: var(--edge);
    border: 0;
    border-radius: 10px;
    color: var(--ink);
    font-size: 18px;
    touch-action: none;
  }
  .dpad button:active { background: var(--maze); color: #fff; }
  .dpad .u { grid-area: 1 / 2; } .dpad .l { grid-area: 2 / 1; }
  .dpad .r { grid-area: 2 / 3; } .dpad .d { grid-area: 3 / 2; }
  .dpad .c { grid-area: 2 / 2; font-family: var(--display); font-size: 8px; letter-spacing: 0.05em; }
  .dpad .c:disabled { opacity: 0.35; }
  @media (pointer: coarse) {
    .dpad { display: grid; }
    .keys { display: none; }
  }
</style>

<main id="main">
  <canvas id="game" tabindex="0" aria-label="Pac-Man game. Use arrow keys to move."></canvas>
  <div class="dpad" id="dpad" aria-label="Direction pad">
    <button class="u" data-dir="U" aria-label="Up">▲</button>
    <button class="l" data-dir="L" aria-label="Left">◀</button>
    <button class="r" data-dir="R" aria-label="Right">▶</button>
    <button class="d" data-dir="D" aria-label="Down">▼</button>
    <button class="c" id="dashBtn" type="button" aria-label="Dash" disabled>DASH</button>
  </div>
  <div class="bar" id="bar">
    <span class="keys"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>WASD</kbd> move · <kbd>Enter</kbd> select / next · <kbd>Esc</kbd> back / skip talk · <kbd>P</kbd> pause · <kbd>Space</kbd> dash · <kbd>M</kbd> sound · <kbd>I</kbd> infinite lives · <kbd>N</kbd> skip level · <kbd>U</kbd> unlock all</span>
    <button class="btn" id="pauseBtn" type="button">PAUSE</button>
    <button class="btn" id="soundBtn" type="button">SOUND ON</button>
    <button class="btn" id="infBtn" type="button" aria-pressed="false">INFINITE LIVES: OFF</button>
    <button class="btn" id="skipBtn" type="button">SKIP LEVEL</button>
    <button class="btn" id="unlockBtn" type="button">UNLOCK ALL</button>
  </div>
</main>

function onCenter(e) { return Math.abs(e.x - Math.round(e.x)) < 1e-6 && Math.abs(e.y - Math.round(e.y)) < 1e-6; }

    const toNext = Math.abs(next - pos);

    else { e[axis] += d * dist; moved += dist; dist = 0; }

    if (e.x > W) e.x -= W + 2;
    if (!onCenter(e)) e.decided = -1;

  if (diff) g.dir = axis === 'x' ? (diff > 0 ? R : L) : (diff > 0 ? D : U);
}

function pacAtCenter(p) {
  const w = G.want;
  if (w && pacOK(p.x + w.x, p.y + w.y)) p.dir = w;
  else if (p.dir && !pacOK(p.x + p.dir.x, p.y + p.dir.y)) p.dir = null;
  if (!p.dir) { const f = flowAt(p.x, p.y); if (f && pacOK(p.x + f.x, p.y + f.y)) p.dir = f; } // a stopped Pac-Man drifts with the current
  if (p.dir) p.face = p.dir;

function targetFor(g) {
  if (g.eaten) return { x: house.doorC, y: house.exitY };
  if (G.modeIdx % 2 === 0) return corner(g);
  const px_ = Math.round(pac.x), py_ = Math.round(pac.y), f = pac.dir || pac.face;
  switch (g.name) {
    case 'blinky': return { x: px_, y: py_ };
    case 'pinky': return { x: px_ + f.x * 4 - (f === U ? 4 : 0), y: py_ + f.y * 4 };
    case 'inky': {
      const vx = px_ + f.x * 2 - (f === U ? 2 : 0), vy = py_ + f.y * 2;
      return { x: 2 * vx - Math.round(blinky.x), y: 2 * vy - Math.round(blinky.y) };

  if (g.eaten && r === house.exitY && (c === house.doorC || c === house.doorC + 1)) { g.mode = 'enter'; return false; }
  const opts = ORDER.filter(d => d !== g.dir.o && ghostOK(c + d.x, r + d.y));
  if (!opts.length) { g.dir = g.dir.o; return true; }
  if (g.frightened) { g.dir = opts[(Math.random() * opts.length) | 0]; return true; }
  const t = targetFor(g);

  for (const d of opts) {

    if (dd < bd) { bd = dd; best = d; }

function ghostUpdate(g, dt, sp) {

  else if (g.mode === 'house' || g.mode === 'leave') v = 0.5;
  else if (inTunnel(g.x, g.y)) v = sp.tunnel;
  else if (g.frightened) v = sp.ghostF;
  else v = sp.ghost * (G.cfg.ghostMul || 1);
  if (g.mode === 'active' && !g.eaten) v *= flowMul(g);

  switch (g.mode) {
    case 'house':
      g.y += g.bob * dist;
      if (g.y < house.homeY - 0.5) { g.y = house.homeY - 0.5; g.bob = 1; }
      if (g.y > house.homeY + 0.5) { g.y = house.homeY + 0.5; g.bob = -1; }

    case 'leave':

      }
      return;

  return corners.reduce((a, c) => Math.hypot(c[0] - pac.x, c[1] - pac.y) > Math.hypot(a[0] - pac.x, a[1] - pac.y) ? c : a);
}
function bossUpdate(dt, sp) {

  const ph = bossPhase(b);
  if (b.state === 'recoil') {
    if (bossStep(b, 1.6 * BASE * dt, Math.round(meta.throne.x - 0.5), meta.throne.y)) b.state = 'chase';
    return;
  }
  if (G.fright > 0) {
    const [tx, ty] = fleeCorner();
    bossStep(b, 0.42 * BASE * dt, tx, ty);
    return;
  }
  bossStep(b, [0, 0.34, 0.4, 0.47][ph] * BASE * dt, Math.round(pac.x - 0.5), Math.round(pac.y));
  aimOrbs(b, dt, [0, 2.4, 1.7, 1.1][ph]);
  if (ph === 3 && (b.burst -= dt) <= 0) { for (const d of ORDER) fireOrb(b, d); b.burst = 5; }

}
// Fire along Pac-Man's row or column once lined up and the cooldown is done.

  if (b.fire > 0 || !(row || col)) return;
  if (row) fireOrb(b, pac.x > b.x ? R : L, Math.round(pac.y));

function bossDie() {
  const b = G.boss;

  clearCheckpoint();

function hitBoss() {

// The Big Blob: its mass is its health (60, in three phases of 20) and sets its size.
// Phase 1 is a race for the dots (they never come back): every dot Pac-Man eats starves it, every
// dot it slurps feeds it, and once the dots are gone it wastes away.
// Phase 2 the ghosts turn up scared blue: eat them before it swallows them.
// Phase 3 it's small and fast: bite it while powered up, then eat the bits before they crawl home.
const BLOB_DOT = 0.075, BLOB_SLURP = 0.06, BLOB_BITES = [0, 1.5, 2, 5], BLOB_BITE3 = 5, BLOB_SAVE = 2.5, BLOB_GHOST = 3, BLOB_MERGE = 2;
const blobR = b => 0.8 + Math.max(0, b.hp) / BOSSES.blob.hp * 2; // 2.8 tiles at full health, 0.8 near the end
const blobTouch = (e, k = 0.8) => Math.hypot(e.x - G.boss.x, e.y - G.boss.y) < blobR(G.boss) * k;
// Heal, but never back up into an earlier phase.
function blobFeed(n) { const b = G.boss; b.hp = Math.min(phaseStartHp(b, bossPhase(b)), b.hp + n); }
function blobHurt(n, quiet) {
  const b = G.boss, before = bossPhase(b), notch = Math.ceil(b.hp / 4);
  b.hp = Math.max(0, b.hp - n);
  if (b.hp <= 0) { bossDie(); return; }
  if (bossPhase(b) !== before) { G.pendingPhase = bossPhase(b); return; }
  if (!quiet && Math.ceil(b.hp / 4) < notch && (!G.bossSay || G.bossSay.t < 1)) bossLine(BLOB_LINES.hit[before]);
}
// Somewhere with lots of dots, for the Blob to waddle over to.
function richestSpot() {
  let best = null, bs = -1;
  for (let k = 0; k < 24; k++) {
    const c = 1 + Math.floor(Math.random() * (W - 3)), r = 2 + Math.floor(Math.random() * (H - 4));
    let s = 0;
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
      const x = c + dx, y = r + dy;
      if (x >= 0 && x < W && y >= 0 && y < H && G.dots[y * W + x] === 1) s++;
    }
    if (s > bs) { bs = s; best = { x: c, y: r }; }
  }
  return best;
}
function blobUpdate(dt, sp) {
  const b = G.boss;
  if (b.inv > 0) b.inv -= dt;
  if (b.flash > 0) b.flash -= dt;
  if (b.hitT > 0) b.hitT -= dt;
  const ph = bossPhase(b);
  if (ph === 2 && !G.buddies.some(s => s.state === 'active') && (G.waveT -= dt) <= 0) { spawnWave(); G.waveT = 2.5; }
  if (G.chill > 0) return;
  if (b.state === 'recoil') { // knocked back by a bite
    b.rt -= dt;
    bossStep(b, 1.1 * BASE * dt, b.tgt.x, b.tgt.y);
    if (b.rt <= 0) { b.state = 'chase'; b.tgt = null; }
    return;
  }
  let tx = Math.round(pac.x - 0.5), ty = Math.round(pac.y), v = [0, 0.3, 0.36, 0.5][ph];
  if (G.fright > 0) { [tx, ty] = fleeCorner(); v = 0.34; }
  else if (ph === 1 && Math.hypot(pac.x - b.x, pac.y - b.y) > 5) { // wander off to the food
    if ((b.retarget -= dt) <= 0 || !b.tgt) { b.tgt = richestSpot(); b.retarget = 2.5; }
    tx = b.tgt.x; ty = b.tgt.y;
  } else if (ph === 2) {
    const prey = G.buddies.filter(s => s.state === 'active').sort((p, q) => Math.hypot(p.x - b.x, p.y - b.y) - Math.hypot(q.x - b.x, q.y - b.y))[0];
    if (prey) { tx = Math.round(prey.x - 0.5); ty = Math.round(prey.y); }
  }
  bossStep(b, v * BASE * dt, tx, ty);
  if (ph === 1) { // slurp the dots under its mouth: the bigger it is, the wider it eats
    const r = Math.round(b.y), half = blobR(b) * 0.5;
    for (let c = Math.round(b.x - half); c <= Math.round(b.x + half); c++) {
      const i = r * W + c;
      if (c < 0 || c >= W || r < 0 || r >= H || G.dots[i] !== 1) continue;
      G.dots[i] = 0; G.dotsLeft--;
      blobFeed(BLOB_SLURP);
      if ((G.slurpT -= 1) <= 0) { SFX.slurp(); G.slurpT = 4; }
    }
    let left = 0;
    for (let i = 0; i < W * H; i++) if (G.dots[i] === 1) left++;
    b.dots0 = b.dots0 || left;
    const scarce = 1 - left / (b.dots0 * 0.35); // food running low: it starts wasting away, faster as the last dots go
    if (scarce > 0) {
      blobHurt((0.3 + scarce * 1.3) * dt, true);
      if (b.state !== 'dead' && !G.bossSay && Math.random() < dt * 0.4) bossLine(BLOB_LINES.starving);
    }

}
function biteBlob() {
  const b = G.boss, ph = bossPhase(b);
  G.fright = 0; G.shake = 0.45;
  b.inv = 1.8; b.hitT = 1.2; b.state = 'recoil'; b.rt = 0.8;
  b.tgt = { x: Math.round(b.x - 0.5 + Math.sign(b.x - pac.x || 1) * 5), y: Math.round(b.y + Math.sign(b.y - pac.y || 1) * 4) };
  addScore(1000); SFX.bossHit();
  popup('1000', b.x, b.y - blobR(b) - 0.5, '#ffd86b', 1.5);
  if (ph === 3) { // chunks fly off and try to crawl back
    const spots = reachTiles({ x: Math.round(b.x), y: b.y + 0.5 }) || [{ x: Math.round(b.x), y: Math.round(b.y) }];
    for (const [k, d] of [[0, L], [1, R]]) {
      const s = spots[k % spots.length];
      G.blobules.push({ x: s.x, y: s.y, dir: d, decided: -1, t: 0, kind: 'small', state: 'active', group: k, fresh: 0.5 });
    }
    SFX.split();
  }
  blobHurt(BLOB_BITES[ph], true); // early bites only nibble: starving is the real weapon
  if (b.state === 'dead' || G.pendingPhase) return;
  if (ph === 3 && b.hp <= BLOB_BITE3) bossTalk(BLOB_LINES.last);
  else bossLine(BLOB_LINES.bite[ph]);

// Phase 2: the four ghosts pour out of the pipes, scared blue, and the Blob wants them for dinner.
function spawnWave() {
  G.buddies = ghosts.map((g, k) => {
    const [c, r] = meta.pipes[k];
    return { name: g.name, color: g.color, x: c, y: r, dir: r < H / 2 ? D : U, decided: -1, state: 'active', t: 0 };
  });
  for (const s of G.buddies) popup('EEK!', s.x, s.y - 1, '#8fdcff', 1.4);
  SFX.wraith();
}
function budAtCenter(s) {
  const opts = ORDER.filter(d => d !== s.dir.o && ghostOK(s.x + d.x, s.y + d.y));
  if (!opts.length) { s.dir = s.dir.o; return true; }
  const b = G.boss;
  if (Math.hypot(s.x - b.x, s.y - b.y) > 7 || Math.random() < 0.25) { s.dir = opts[(Math.random() * opts.length) | 0]; return true; }
  let best = opts[0], bd = -1;
  for (const d of opts) {
    const dd = Math.hypot(s.x + d.x - b.x, s.y + d.y - b.y);
    if (dd > bd) { bd = dd; best = d; }
  }
  s.dir = best;
  return true;
}
// Bits of Blob scatter for a moment, then crawl straight back to the big one.
function bitAtCenter(s) {
  const opts = ORDER.filter(d => d !== s.dir.o && ghostOK(s.x + d.x, s.y + d.y));
  if (!opts.length) { s.dir = s.dir.o; return true; }
  const b = G.boss, away = s.t < 1.2;
  let best = opts[0], bd = away ? -1 : Infinity;
  for (const d of opts) {
    const dd = Math.hypot(s.x + d.x - b.x, s.y + d.y - b.y);
    if (away ? dd > bd : dd < bd) { bd = dd; best = d; }
  }
  s.dir = best;
  return true;
}
function blobCrewUpdate(dt) {
  const b = G.boss;
  for (const s of G.buddies) {
    s.t += dt;
    if (s.state === 'saved') { s.y -= 7 * dt; continue; } // eyes zip off home
    if (G.chill > 0) continue;
    step(s, 0.4 * BASE * dt * flowMul(s), budAtCenter, false);
    if (b.state !== 'dead' && blobTouch(s, 0.7)) {
      s.state = 'eaten';
      b.eaten = [...(b.eaten || []), s.color].slice(-4);
      b.flash = 0.5; b.flashColor = s.color;
      blobFeed(BLOB_GHOST); SFX.burp();
      popup('BURP!', s.x, s.y, s.color);
      bossLine(BLOB_LINES.absorb);
    }
  }
  G.buddies = G.buddies.filter(s => s.state === 'active' || (s.state === 'saved' && s.t < 3));
  for (const s of G.blobules) {
    s.t += dt;
    if (s.fresh > 0) s.fresh -= dt;
    if (G.chill > 0) continue;
    step(s, 0.55 * BASE * dt * flowMul(s), bitAtCenter, false);
    if (s.t > 1.2 && b.state !== 'dead' && blobTouch(s, 0.75)) {
      s.state = 'merged';
      blobFeed(BLOB_MERGE); SFX.slurp();
      popup('SLURP', s.x, s.y, '#9be86f');
      if (!G.bossSay) bossLine(BLOB_LINES.merge);
    }
  }
  G.blobules = G.blobules.filter(s => s.state === 'active');
}

// Freeze the action for a phase change: the boss rages, the bar turns over, and the save checkpoints.
function startPhase(ph) {
  const b = G.boss;
  G.pendingPhase = 0;
  G.state = 'phase'; G.timer = 3.4; G.phaseTo = ph;
  G.orbs = []; G.fright = 0; G.shake = 1.2; G.popups = [];
  if (b.kind === 'blob') { b.hp = Math.min(b.hp, phaseStartHp(b, ph)); G.blobules = []; }
  bossTalk(BOSSES[b.kind].lines.phase[ph], 3.4);
  SFX.roar();
  if (G.lvIndex < ROOF) { save.ck = { ...save.ck, [G.lvIndex]: phaseStartHp(b, ph) }; writeSave(); }
}
function endPhase() {
  const b = G.boss, ph = G.phaseTo;
  G.state = 'play';
  b.fire = 1.5;
  if (b.kind === 'king') { for (let i = 1; i < ph; i++) spawnMinion(); b.summon = 10; b.burst = 3; }
  else if (ph === 2) { spawnWave(); G.waveT = 2.5; }
  else G.buddies = [];
}
function orbsUpdate(dt) {
  const d = 0.85 * BASE * dt;
  G.orbs = G.orbs.filter(o => {
    o.x += o.dir.x * d; o.y += o.dir.y * d;
    if (o.x < -1 || o.x > W || o.y < -1 || o.y > H) return false;
    const wall = tile(Math.round(o.x), Math.round(o.y)) === '#';
    if (!wall) o.armed = true; // orbs leave the boss through pillars, then stop at the first wall
    return !(wall && o.armed);
  });
}

function releaseCheck(dt) {
  const g = [pinky, inky, clyde].find(g => G.ghosts.includes(g) && g.mode === 'house');
  if (!g) { G.globalMode = false; return; }
  if (G.chill > 0) return;
  G.idle += dt;
  const limits = G.cfg.release || { pinky: 0, inky: 20, clyde: 40 };
  const limit = G.globalMode ? { pinky: 7, inky: 17, clyde: 32 }[g.name] : limits[g.name];
  const count = G.globalMode ? G.globalDots : g.dotCount;
  if (count >= limit || G.idle >= 4) { g.mode = 'leave'; G.idle = 0; }
}

// ---------- Play loop ----------
// Eat the dot at (c, r): under Pac-Man, or pulled in by the magnet.
function eatDot(c = Math.round(pac.x), r = Math.round(pac.y), pulled = false) {
  if (c < 0 || c >= W) return;
  const i = r * W + c, v = G.dots[i];
  if (!v) return;
  G.dots[i] = 0; G.dotsLeft--; G.dotsEaten++; G.idle = 0;
  if (G.globalMode) G.globalDots++;
  else { const h = [pinky, inky, clyde].find(g => G.ghosts.includes(g) && g.mode === 'house'); if (h) h.dotCount++; }
  if (pulled) { G.flyDots.push({ x: c, y: r, t: 0 }); if (G.flyDots.length % 3 === 1) SFX.pull(); }
  else SFX.dot();
  if (v === 1) {
    addScore(10);
    if (G.boss && G.boss.kind === 'blob' && G.boss.state !== 'dead' && bossPhase(G.boss) === 1) blobHurt(BLOB_DOT);
  } else if (v === 5) {
    addScore(100); SFX.magnet();
    G.magnet = MAGNET_TIME;
    popup('MAGNET!', c, r - 1, '#ff4f4f', 1.4);
  } else if (v === 2) {
    addScore(50);
    SFX.power();
    const ft = G.cfg.fright;
    G.fright = ft; G.combo = 0;
    for (const g of G.ghosts) {
      if (g.eaten) continue;
      if (g.mode === 'active') g.reverse = true;
      if (ft > 0) g.frightened = true;
    }
  } else if (v === 3) {
    addScore(50);
    SFX.frost();
    G.chill = G.cfg.chill || 5;
    for (const w of G.wraiths) w.reach = w.state === 'active' || w.state === 'leave' ? reachTiles(w) : null;
  }
  if (G.cfg.boss) { if (v === 2 || v === 3) G.respawns.push({ i, v, t: v === 2 ? (G.cfg.boss === 'blob' ? 20 : 12) : 20 }); G.orbs = v === 3 ? [] : G.orbs; return; }
  const f1 = Math.round(G.dotsTotal * 0.3), f2 = Math.round(G.dotsTotal * 0.7);
  if (G.dotsEaten === f1 || G.dotsEaten === f2) G.fruit = { kind: fruitFor(G.lvIndex), timer: 9.5 };
  if (G.dotsLeft === 0) { G.state = 'clear'; G.timer = 0; SFX.clear(); }
}

function play(dt) {
  const sp = TIERS[G.cfg.tier];
  if (G.boss && G.boss.state === 'dead') {
    G.boss.dead += dt;
    if (G.boss.dead >= 2.8) { G.state = 'clear'; G.timer = 0; SFX.clear(); }
    return;
  }
  if (G.want && pac.dir && G.want === pac.dir.o) { pac.dir = G.want; pac.face = G.want; }
  const dashing = pac.dash > 0;
  const moved = step(pac, dt * BASE * (G.fright > 0 ? sp.pacF : sp.pac) * (dashing ? DASH_SPEED : flowMul(pac)), pacAtCenter, true);
  pac.anim += moved;
  if (dashing) {
    pac.trail.unshift({ x: pac.x, y: pac.y });
    if (pac.trail.length > 8) pac.trail.pop();
    pac.dash -= moved;
    if (pac.dash <= 0 || !pac.dir) { pac.dash = 0; pac.grace = 0.25; }
  } else {
    if (pac.trail.length) pac.trail.pop();
    if (G.cfg.dash) G.dashCharge = Math.min(1, G.dashCharge + dt / DASH_RECHARGE);
  }
  if (pac.grace > 0) pac.grace -= dt;
  const safe = pac.dash > 0 || pac.grace > 0;
  eatDot();
  if (G.state !== 'play') return;
  if (G.magnet > 0) { magnetUpdate(dt); if (G.state !== 'play') return; }
  for (const f of G.flyDots) f.t += dt;
  G.flyDots = G.flyDots.filter(f => f.t < 0.25);
  if (G.hounds.length) {
    const p = pacTile(), k = p.y * W + p.x;
    if (k !== G.pacKey && pac.x > -0.5 && pac.x < W - 0.5) { G.pacKey = k; houndsTrack(dashing); }
  }
  if (G.cfg.dark) { // light swells while powered up, and gutters on the flickering floor
    const want = G.cfg.dark + (G.fright > 0 ? 3.5 : 0);
    G.light += (want - G.light) * Math.min(1, dt * 3);
  }

  if (G.chill > 0) G.chill = Math.max(0, G.chill - dt);
  if (G.fright > 0) {
    G.fright -= dt;
    if (G.fright <= 0) { G.fright = 0; G.ghosts.forEach(g => { g.frightened = false; }); }
  } else if (G.chill === 0) {
    G.modeTime += dt;
    if (G.modeTime >= (G.cfg.schedule || SCHEDULES[G.cfg.tier])[G.modeIdx]) {
      G.modeTime = 0; G.modeIdx++;
      G.ghosts.forEach(g => { if (g.mode === 'active' && !g.eaten) g.reverse = true; });
    }
  }
  releaseCheck(dt);
  for (const g of G.ghosts) ghostUpdate(g, dt, sp);
  for (const w of G.wraiths) wraithUpdate(w, dt, sp);
  for (const s of G.slimes) slimeUpdate(s, dt, sp);
  for (const h of G.hounds) houndUpdate(h, dt, sp);
  if (G.vents.length) ventsUpdate(dt);
  if (G.boss) {
    if (G.boss.kind === 'blob') { blobUpdate(dt, sp); blobCrewUpdate(dt); }
    else bossUpdate(dt, sp);
    for (const m of G.minions) { if (m.fresh > 0) m.fresh -= dt; if (G.chill === 0) step(m, (G.fright > 0 ? 0.45 : 0.7) * BASE * dt, slimeAtCenter, false); }
    orbsUpdate(dt);
    for (const r of G.respawns) if ((r.t -= dt) <= 0) { G.dots[r.i] = r.v; G.dotsLeft++; }
    G.respawns = G.respawns.filter(r => r.t > 0);
  }

  if (G.fruit) {
    G.fruit.timer -= dt;
    if (G.fruit.timer <= 0) G.fruit = null;
    else if (pac.y === meta.fruit.y && Math.abs(pac.x - meta.fruit.x) < 0.8) {
      const pts = FRUIT_PTS[G.fruit.kind];
      addScore(pts); SFX.fruit();
      popup(String(pts), meta.fruit.x, meta.fruit.y, '#ffb8ff', 2);
      G.fruit = null;
    }
  }
  for (const p of G.popups) p.t -= dt;
  G.popups = G.popups.filter(p => p.t > 0);

  for (const g of G.ghosts) {
    if (g.mode !== 'active' || g.eaten) continue;
    let dx = Math.abs(g.x - pac.x);
    if (dx > W / 2) dx = W + 2 - dx;
    if (dx >= 0.6 || Math.abs(g.y - pac.y) >= 0.6) continue;
    if (G.chill > 0) {
      g.eaten = true; g.frightened = false;
      addScore(300); SFX.shatter();
      popup('300', g.x, g.y, '#bdf4ff');
      continue;
    }
    if (g.frightened) {
      g.frightened = false; g.eaten = true;
      const pts = 200 * 2 ** G.combo; G.combo++;
      addScore(pts); SFX.ghost();
      G.eatenGhost = g;
      popup(String(pts), g.x, g.y, '#00f0ff', 0.9, true);
      G.state = 'eatpause'; G.timer = 0.9;
      return;
    }
    if (safe) continue;
    G.state = 'dying'; G.timer = 0;
    return;
  }
  for (const w of G.wraiths) {
    const frozenHere = G.chill > 0 && (w.state === 'active' || w.state === 'leave');
    if (w.state !== 'active' && !frozenHere) continue;
    const touching = Math.hypot(w.x - pac.x, w.y - pac.y) < 0.7 ||
      (frozenHere && w.reach && w.reach.some(t => Math.abs(t.x - pac.x) < 0.6 && Math.abs(t.y - pac.y) < 0.6));
    if (!touching) continue;
    if (G.chill > 0) {
      w.state = 'eaten';
      addScore(500); SFX.shatter(); SFX.ghost();
      popup('500', w.x, w.y, '#bdf4ff');
      continue;
    }
    if (safe) continue;
    G.state = 'dying'; G.timer = 0;
    return;
  }
  for (const s of [...G.slimes]) {
    if (s.state !== 'active' || s.fresh > 0) continue;
    let dx = Math.abs(s.x - pac.x);
    if (dx > W / 2) dx = W + 2 - dx;
    const rad = s.kind === 'big' ? 0.7 : 0.55;
    if (dx >= rad || Math.abs(s.y - pac.y) >= rad) continue;
    if (G.fright > 0 || G.chill > 0) { eatSlime(s); continue; }
    if (safe) continue;
    G.state = 'dying'; G.timer = 0;
    return;
  }

function update(dt) {

// ---------- Story screens ----------
// Draws with G.fright forced on, so sprites show their blue frightened face.
function withFright(on, fn) { const f = G.fright; if (on) G.fright = 5; fn(); G.fright = f; }
const STARS = (() => {
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  return Array.from({ length: 46 }, () => ({ x: rnd() * 28, y: 2.5 + rnd() * 27, z: rnd() < 0.2 ? 0.2 : 0.12, p: Math.floor(rnd() * 5), c: rnd() < 0.3 ? '#8f9bff' : '#ffffff' }));
})();
function drawSky(moon = true) {
  screenSpace();
  for (const s of STARS) {
    if ((Math.floor(G.t * 2) + s.p) % 7 === 0) continue;
    ctx.fillStyle = s.c; ctx.fillRect(s.x, s.y, s.z, s.z);
  }
  if (!moon) return;
  ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.arc(3.6, 5.6, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000000'; ctx.beginPath(); ctx.arc(4.3, 5.1, 1.3, 0, Math.PI * 2); ctx.fill();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
// Draws one character sprite centered on (cx, cy) in screen tiles, at scale k.
function drawCharacter(who, mood, cx, cy, k, face = R, open = 0.4) {
  const sp = SPEAKERS[who];
  screenSpace();
  ctx.save();
  ctx.translate(cx, cy);
  if (who === 'KING') { ctx.scale(k * 0.5, k * 0.5); ctx.translate(0, 0.45); }
  else if (who === 'BLOB') { ctx.scale(k * 0.42, k * 0.42); ctx.translate(0, 0.3); }
  else ctx.scale(k, k);
  const at = { x: -0.5, y: -0.5 };
  withFright(mood === 'scared', () => {
    if (who === 'PAC') drawPac(at.x, at.y, face, open);
    else if (sp.ghost !== undefined) drawGhost({ ...at, dir: face, color: sp.color, frightened: mood === 'scared', eaten: false });
    else if (who === 'WRAITH') drawWraith({ ...at, state: 'active', dir: face });
    else if (who === 'SLIME') drawSlime({ kind: 'big', ...at, dir: face, state: 'active', group: 0 });
    else if (who === 'KING') drawBoss({ ...at, kind: 'king', state: 'chase', hp: mood === 'angry' ? 1 : BOSSES.king.hp, inv: 0 });
    else if (who === 'BLOB') drawBlob({ ...at, kind: 'blob', state: 'chase', hp: BOSSES.blob.hp, look: mood === 'angry' ? 3 : 1, inv: 0, flash: 0, eaten: [] });
    else if (who === 'HOUND') drawHound({ ...at, dir: face, state: 'hunt', sniff: mood === 'sniff' ? 1 : 0 });

}
function wrapText(s, maxW, size) {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.font = Math.round(px * size) + FONT;
  const out = []; let cur = '';

    if (cur && ctx.measureText(t).width > maxW * px) { out.push(cur); cur = w; } else cur = t;
  }
  if (cur) out.push(cur);
  ctx.restore();

}

function drawDialog() {

}

// A lap of Pac-Man chased by the cast, then a lap chasing the blue ghosts back, like the attract mode.
function drawParade(row, speed = 7) {
  const lap = 52, p = (G.t * speed) % (lap * 2), chase = p < lap;
  const open = (1 - Math.cos(G.t * 18)) / 2;
  if (chase) {
    const x = p - 2, crew = ['BLINKY', 'PINKY', 'INKY', 'CLYDE', 'WRAITH', 'SLIME'];
    drawCharacter('PAC', null, x, row, 1, R, open);
    crew.forEach((c, k) => drawCharacter(c, null, x - 2.3 * (k + 1), row, 1, R));
  } else {
    const x = 43 - (p - lap);
    drawCharacter('PAC', null, x, row, 1, L, open);
    ['BLINKY', 'PINKY', 'INKY', 'CLYDE'].forEach((c, k) => drawCharacter(c, 'scared', x - 2.3 * (k + 1), row, 1, L));

function drawTower() {

  text(sel >= ROOF ? 'THE ROOF' : `${floorLabel(sel)}  ${FLOOR_NAMES[sel]}`, 14, 32.1, ink, 'center', 0.62);
  text(sel >= ROOF ? 'ENDLESS BONUS ROUNDS' : `STAGE ${st}: ${STAGE_NAMES[st]}`, 14, 33.25, '#b9bddc', 'center', 0.4);
  const best = save.best[sel] || 0;
  text(best ? `BEST ${best}` : (isCleared(sel) ? 'CLEARED' : 'NOT CLEARED YET'), 14, 34.2, '#6b6f93', 'center', 0.38);
  const coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  text(coarse ? 'TAP A FLOOR, TAP AGAIN TO PLAY' : 'UP/DOWN MOVE  ENTER PLAY  ESC MENU', 14, 35.2, '#6b6f93', 'center', 0.34);
}

function drawEnding() {
  drawSky();
  text('THE END', 14.2, 4.7, '#2a3cff', 'center', 1.9);
  text('THE END', 14, 4.5, '#ffe600', 'center', 1.9);
  text('THE FRUIT IS HOME. AGAIN.', 14, 8, '#ffffff', 'center', 0.55);
  text('THE GHOSTS GOT THEIR OLD JOBS BACK.', 14, 9.3, '#b9bddc', 'center', 0.42);
  // Victory lap: Pac-Man leads, the fruit follows, the whole cast tags along happily.
  const x = (G.t * 5) % 58 - 4;
  drawCharacter('PAC', null, x, 14, 1, R, (1 - Math.cos(G.t * 18)) / 2);
  FRUITS.slice(0, 5).forEach((f, k) => { screenSpace(); drawFruit(f, x - 2 - k * 1.6 - 0.5, 13.5); });
  ['BLINKY', 'PINKY', 'INKY', 'CLYDE', 'WRAITH', 'SLIME', 'HOUND'].forEach((c, k) => drawCharacter(c, null, x - 11 - k * 2.3, 14, 1, R));
  const bob = Math.floor(G.t * 3) % 2 ? 0.15 : 0;
  drawCharacter('KING', 'scared', 8.5, 20 + bob, 1.5);
  drawCharacter('BLOB', 'scared', 19.5, 20.2 - bob, 1.5);
  text('THE KING AND THE BLOB', 14, 24, '#ffd86b', 'center', 0.45);
  text('JOINED THE SAME GYM.', 14, 25.2, '#ffd86b', 'center', 0.45);
  text('ROOF UNLOCKED: ENDLESS MODE', 14, 27.8, '#ffe600', 'center', 0.5);
  text('THANKS FOR PLAYING!', 14, 29.4, '#ff4fa3', 'center', 0.55);
  if (G.timer > 1.5 && Math.floor(G.t * 2) % 2 === 0) text('PRESS ENTER', 14, 32.5, '#ffffff', 'center', 0.6);
}

// Comic speech bubble over the King, flipped below him near the top wall and kept on screen.
function drawBossSay() {
  const b = G.boss, size = 0.42, lines = wrapText(G.bossSay.text, 11, size);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.font = Math.round(px * size) + FONT;
  const w = Math.max(...lines.map(l => ctx.measureText(l).width / px)) + 1.1;
  ctx.restore();
  const h = lines.length * 0.72 + 0.7;
  const cx = ox + b.x + 0.5, top = oy + b.y - (b.kind === 'blob' ? blobR(b) * 0.86 + 0.6 : 2.6);
  const below = top - h < TOP + 1.2;
  const by = below ? oy + b.y + (b.kind === 'blob' ? blobR(b) + 0.4 : 2.4) : top - h;
  const bx = Math.max(0.4, Math.min(SCREEN_COLS - 0.4 - w, cx - w / 2));
  const pop = G.bossSay.t > 2.45 && G.state !== 'phase' ? 0.6 : 1; // tiny pop-in
  screenSpace();
  ctx.save();
  ctx.translate(cx, below ? by : by + h); ctx.scale(pop, pop); ctx.translate(-cx, -(below ? by : by + h));
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#000000'; ctx.lineWidth = 0.1;
  roundRect(bx, by, w, h, 0.35); ctx.fill();
  const tx = Math.max(bx + 0.5, Math.min(bx + w - 0.5, cx));
  ctx.beginPath();
  if (below) { ctx.moveTo(tx - 0.35, by + 0.05); ctx.lineTo(tx, by - 0.55); ctx.lineTo(tx + 0.35, by + 0.05); }
  else { ctx.moveTo(tx - 0.35, by + h - 0.05); ctx.lineTo(tx, by + h + 0.55); ctx.lineTo(tx + 0.35, by + h - 0.05); }
  ctx.fill();
  ctx.restore();
  if (pop < 1) return;
  lines.forEach((l, j) => text(l, bx + w / 2, by + 0.35 + j * 0.72 - 0.14, '#1a0010', 'center', size));
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (G.state === 'menu') { drawMenu(); return; }
  if (G.state === 'tower') { drawTower(); return; }
  if (G.state === 'ending') { drawEnding(); return; }
  drawHUD();

  const stageColor = WALL_COLORS[G.cfg.stage];
  shakeX = G.shake > 0 ? (Math.random() - 0.5) * 0.5 * Math.min(1, G.shake * 2) : 0;
  shakeY = G.shake > 0 ? (Math.random() - 0.5) * 0.5 * Math.min(1, G.shake * 2) : 0;
  const flash = G.state === 'clear' && G.timer > 1 && Math.floor((G.timer - 1) / 0.22) % 2 === 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(mazeArt(G.cfg.maze, flash ? '#ffffff' : stageColor), (ox + shakeX) * px, (oy + shakeY) * px, W * px, H * px);

  mazeSpace();
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  if (G.state !== 'clear' && M.some(r => r.includes('-'))) { ctx.fillStyle = '#ffb8ff'; ctx.fillRect(house.doorC, house.exitY + 1.38, 2, 0.24); }
  if (hasFlow && G.state !== 'cast') drawWater();
  if (G.state !== 'cast') for (const v of G.vents) drawVentGrate(v);

  const pelletOn = G.state !== 'play' || Math.floor(G.t * 5) % 2 === 0;
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const v = G.dots[r * W + c];
    if (v === 1) { ctx.fillStyle = '#ffb8ae'; ctx.fillRect(c + 0.375, r + 0.375, 0.25, 0.25); }
    else if (v === 2 && pelletOn) { ctx.fillStyle = '#ffb8ae'; ctx.beginPath(); ctx.arc(c + 0.5, r + 0.5, 0.42, 0, Math.PI * 2); ctx.fill(); }
    else if (v === 3) drawFrostBerry(c + 0.5, r + 0.5, 1.1);
    else if (v === 5) drawMagnet(c + 0.5, r + 0.55);
  }

  if (G.state === 'cast') { ctx.restore(); drawTitle(); return; }

  if (G.fruit) drawFruit(G.fruit.kind, meta.fruit.x, meta.fruit.y);
  if (G.magnet > 0 && (G.magnet > 1.5 || Math.floor(G.t * 8) % 2)) { // the pull radius, spinning
    ctx.save(); ctx.strokeStyle = '#ff5a5a'; ctx.lineWidth = 0.08; ctx.setLineDash([0.4, 0.35]); ctx.lineDashOffset = -G.t * 3;
    ctx.beginPath(); ctx.arc(pac.x + 0.5, pac.y + 0.5, MAGNET_R, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
  for (const f of G.flyDots) { // pulled dots zipping into Pac-Man
    const k = f.t / 0.25;
    ctx.fillStyle = '#ffb8ae';
    ctx.fillRect(f.x + (pac.x - f.x) * k + 0.375, f.y + (pac.y - f.y) * k + 0.375, 0.25, 0.25);
  }
  if (G.chill > 0) {
    ctx.strokeStyle = '#bdf4ff'; ctx.lineWidth = 0.08;
    const k = 0.3 + (Math.floor(G.t * 6) % 2) * 0.12;
    for (const w of G.wraiths) if (w.reach && (w.state === 'active' || w.state === 'leave')) for (const t of w.reach) {
      ctx.beginPath();
      ctx.moveTo(t.x + 0.5 - k, t.y + 0.5); ctx.lineTo(t.x + 0.5 + k, t.y + 0.5);
      ctx.moveTo(t.x + 0.5, t.y + 0.5 - k); ctx.lineTo(t.x + 0.5, t.y + 0.5 + k);
      ctx.stroke();
    }
  }

  const showEnemies = G.state === 'ready' || G.state === 'phase' || (G.state === 'dialog' && G.dlg.then === 'ready') || G.state === 'play' || G.state === 'eatpause' || (G.state === 'dying' && G.timer < 1) || (G.state === 'clear' && G.timer < 1);
  if (showEnemies) for (const h of G.hounds) drawScent(h);
  if (G.state === 'dying') {
    if (G.timer < 1) drawPac(pac.x, pac.y, pac.face, 0.4);
    else drawPacDeath(pac.x, pac.y, (G.timer - 1) / 1.4);
  } else if (G.state !== 'over' && G.state !== 'eatpause') {
    const open = G.state === 'ready' || G.state === 'dialog' ? 0 : (1 - Math.cos(pac.anim * Math.PI * 2 * 0.8)) / 2;
    ctx.save();
    pac.trail.forEach((t, i) => {
      if (i % 2 || Math.abs(t.x - pac.x) > 5) return;
      ctx.globalAlpha = 0.45 * (1 - i / pac.trail.length);
      drawPac(t.x, t.y, pac.face, open);
    });
    ctx.restore();
    drawPac(pac.x, pac.y, pac.face, G.state === 'clear' ? 0 : open);
  }
  if (showEnemies) {
    for (const s of G.slimes) if (s.state === 'house') drawSlime(s); // house-bound ones sit behind the ghosts
    for (const w of G.wraiths) if (w.state === 'house') drawWraith(w);
    for (const g of G.ghosts) if (g !== G.eatenGhost) drawGhost(g);
    for (const s of G.slimes) if (s.state !== 'house') drawSlime(s);
    for (const w of G.wraiths) if (w.state !== 'house') drawWraith(w);
    for (const m of G.minions) drawGhost({ ...m, frightened: true, eaten: false });
    for (const h of G.hounds) drawHound(h);
    for (const s of G.blobules) drawSlime({ ...s, state: 'bit', blue: true });
    for (const s of G.buddies) drawGhost({ ...s, dir: s.state === 'saved' ? U : s.dir, panic: true, frightened: false, eaten: s.state === 'saved' });
  }
  if (G.boss && (showEnemies || G.state === 'clear')) drawBoss(G.boss);
  if (showEnemies) {
    for (const o of G.orbs) drawOrb(o);
    for (const v of G.vents) drawSteam(v);
  }
  if (G.cfg.dark && G.state !== 'clear') drawDark();
  ctx.restore();

  for (const p of G.popups) text(p.text, ox + p.x + 0.5, oy + p.y, p.color, 'center', 0.55);
  if (G.state === 'ready') drawBanner();
  if (G.state === 'clear' && G.timer < 1.2 && !G.cfg.boss) {
    const last = G.lvIndex === LEVELS.length - 1, stageEnd = G.lvIndex < LEVELS.length - 1 && LEVELS[G.lvIndex + 1].stage !== G.cfg.stage;
    text(last ? 'ALL STAGES CLEAR!' : stageEnd ? `STAGE ${G.cfg.stage} CLEAR!` : 'LEVEL CLEAR!', 14, 19.6, '#ffe600', 'center', 0.8);
  }
  if (G.state === 'clear' && G.cfg.boss) {
    screenSpace();
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(2.5, 14.8, 23, 6.6);
    ctx.strokeStyle = '#ffd86b'; ctx.lineWidth = 0.12; ctx.strokeRect(2.5, 14.8, 23, 6.6);
    const blob = G.cfg.boss === 'blob';
    text(`${BOSSES[G.cfg.boss].name} DEFEATED!`, 14, 15.8, '#ffd86b', 'center', 0.7);
    if (Math.floor(G.t * 3) % 2 === 0) text(blob ? 'YOU WIN!' : 'VICTORY!', 14, 17.6, '#ffe600', 'center', 1);
    text(blob ? 'THE FRUIT IS SAVED. AGAIN!' : 'THE FRUIT IS SAVED!', 14, 19.6, '#b9bddc', 'center', 0.5);
  }
  if (G.state === 'over') {
    text('GAME  OVER', 14, 19.6, '#ff2a2a', 'center');
    if (G.timer > 1.5 && Math.floor(G.t * 2) % 2 === 0) {
      if (G.cfg.boss && G.lvIndex < ROOF) {
        const def = BOSSES[G.cfg.boss];
        text(`ENTER: RETRY FROM PHASE ${bossPhase({ kind: G.cfg.boss, hp: (save.ck && save.ck[G.lvIndex]) || def.hp })}`, 14, 21.6, '#ffffff', 'center', 0.5);
        text('ESC: BACK TO TOWER', 14, 22.8, '#b9bddc', 'center', 0.45);
      } else text('ENTER: BACK TO TOWER', 14, 21.6, '#ffffff', 'center', 0.55);
    }
  }
  if (G.bossSay && G.boss && G.boss.state !== 'dead' && (showEnemies || G.state === 'phase')) drawBossSay();
  if (G.state === 'phase') {
    const t = 3.4 - G.timer;
    if (t > 0.3 && Math.floor(G.t * 4) % 4 !== 0) {
      screenSpace();
      ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(4, 24.6, 20, 3);
      const def = BOSSES[G.boss.kind], col = def.colors[G.phaseTo];
      const tip = G.boss.kind === 'blob' ? (G.phaseTo === 2 ? 'EAT THE GHOSTS BEFORE IT DOES' : 'BITE IT, THEN EAT THE BITS') : def.tips[G.phaseTo];
      ctx.strokeStyle = col; ctx.lineWidth = 0.14; ctx.strokeRect(4, 24.6, 20, 3);
      text(`PHASE ${G.phaseTo}`, 14, 25.1, col, 'center', 1);
      text(tip, 14, 26.5, '#ffffff', 'center', 0.4);
    }
  }
  if (G.state === 'dialog') drawDialog();
  if (G.paused) {
    screenSpace();
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(8, 18.5, 12, 3);
    text('PAUSED', 14, 19.5, '#ffffff', 'center');
  }
}

// ---------- Layout ----------
const main = document.getElementById('main');
const bar = document.getElementById('bar');
const dpad = document.getElementById('dpad');
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const cs = getComputedStyle(main);
  const availW = main.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const dpadH = getComputedStyle(dpad).display !== 'none' ? dpad.offsetHeight + 12 : 0;
  const availH = main.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - bar.offsetHeight - 12 - dpadH;
  const S = Math.max(6, Math.min(availW / SCREEN_COLS, availH / TOTAL_ROWS));
  canvas.style.width = (S * SCREEN_COLS) + 'px';
  canvas.style.height = (S * TOTAL_ROWS) + 'px';
  canvas.width = Math.round(S * SCREEN_COLS * dpr);
  canvas.height = Math.round(S * TOTAL_ROWS * dpr);
  px = canvas.width / SCREEN_COLS;
}
window.addEventListener('resize', resize);

// ---------- Input ----------
const pauseBtn = document.getElementById('pauseBtn');
const soundBtn = document.getElementById('soundBtn');
function togglePause() {
  if (G.state === 'over' || MENU_STATES.has(G.state)) return;
  G.paused = !G.paused;
  pauseBtn.textContent = G.paused ? 'RESUME' : 'PAUSE';
}
const infBtn = document.getElementById('infBtn');
function setInfinite(on) {
  infinite = on;
  infBtn.textContent = on ? 'INFINITE LIVES: ON' : 'INFINITE LIVES: OFF';
  infBtn.setAttribute('aria-pressed', String(on));
  try { localStorage.setItem('pacman.infinite', on ? '1' : '0'); } catch (e) {}
}
// Testing aid: count the current level as cleared and jump to the next one's intro.
function skipLevel() {
  if (G.state === 'over' || (MENU_STATES.has(G.state) && G.state !== 'dialog')) return;
  if (G.paused) togglePause();
  const i = G.lvIndex;
  if (i >= ROOF) { loadLevel(i + 1); G.state = 'ready'; G.timer = 2; return; }
  recordClear(i, 0);
  startLevel(i + 1);
}
function toggleSound() {
  muted = !muted;
  soundBtn.textContent = muted ? 'SOUND OFF' : 'SOUND ON';
  audioOn();
}
function steer(dir) {
  audioOn();
  if (G.state === 'menu') { if (dir === U || dir === D) menuMove(dir === U ? -1 : 1); return; }
  if (G.state === 'tower') { if (dir === U || dir === D) towerMove(dir === U); return; }
  if (MENU_STATES.has(G.state) || G.state === 'over') return;
  if (G.paused) togglePause();
  if (dir) G.want = dir;
}
function confirmKey() {
  audioOn();
  switch (G.state) {
    case 'menu': menuSelect(); break;
    case 'cast': toMenu(); break;
    case 'tower': towerEnter(); break;
    case 'dialog': dialogNext(); break;
    case 'ending': if (G.timer > 1.5) toTower(ROOF, BLOB_FLOOR); break;
    case 'over':
      if (G.timer <= 1.5) break;
      if (G.lvIndex >= ROOF && G.score > (save.best[ROOF] || 0)) { save.best[ROOF] = G.score; writeSave(); }
      if (G.cfg.boss && G.lvIndex < ROOF) startLevel(G.lvIndex);
      else toTower(Math.min(G.lvIndex, ROOF));
      break;
    default: togglePause();
  }
}
function backKey() {
  if (G.state === 'dialog') endDialog();
  else if (G.state === 'tower' || G.state === 'cast') toMenu();
  else if (G.state === 'over') { if (G.timer > 1.5) toTower(Math.min(G.lvIndex, ROOF)); }
  else if (G.state !== 'menu' && G.state !== 'ending' && G.state !== 'over') togglePause();
}
const KEYS = { ArrowUp: U, ArrowDown: D, ArrowLeft: L, ArrowRight: R, w: U, s: D, a: L, d: R, W: U, S: D, A: L, D: R };
window.addEventListener('keydown', e => {
  if (KEYS[e.key]) { e.preventDefault(); steer(KEYS[e.key]); return; }
  if (e.key === ' ' && G.state === 'play' && G.cfg.dash && !G.paused) { e.preventDefault(); triggerDash(); return; }
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); confirmKey(); return; }
  if (e.key === 'Escape') { backKey(); return; }
  if (e.key === 'p' || e.key === 'P') togglePause();
  if (e.key === 'm' || e.key === 'M') toggleSound();
  if (e.key === 'i' || e.key === 'I') setInfinite(!infinite);
  if (e.key === 'n' || e.key === 'N') skipLevel();
  if ((e.key === 'u' || e.key === 'U') && (G.state === 'tower' || G.state === 'menu')) unlockAll();
});
pauseBtn.addEventListener('click', togglePause);
soundBtn.addEventListener('click', toggleSound);
infBtn.addEventListener('click', () => setInfinite(!infinite));
document.getElementById('skipBtn').addEventListener('click', skipLevel);
document.getElementById('unlockBtn').addEventListener('click', unlockAll);
try { setInfinite(localStorage.getItem('pacman.infinite') === '1'); } catch (e) { setInfinite(false); }

let swipe = null;
canvas.addEventListener('pointerdown', e => {
  canvas.focus();
  audioOn();
  swipe = { x: e.clientX, y: e.clientY };
  const rect = canvas.getBoundingClientRect();
  const row = (e.clientY - rect.top) / rect.height * TOTAL_ROWS, col = (e.clientX - rect.left) / rect.width * SCREEN_COLS;
  if (G.state === 'menu') {
    const k = Math.floor((row - 16.6) / 2.2);
    if (k >= 0 && k < menuItems().length) {
      if (k !== G.menu.sel) G.menu.confirm = false;
      G.menu.sel = k; menuSelect();
    }
  } else if (G.state === 'tower') {
    const f = floorAt(row + towerCam(G.tower.py));
    if (f === null || !canEnter(f)) return;
    if (f === G.tower.sel) towerEnter(); else { G.tower.sel = f; SFX.tick(); }
  } else if (G.state === 'dialog') {
    if (row > 26.4 && row < 28.4 && col > 19) endDialog(); else dialogNext();
  } else if (G.state === 'cast' || G.state === 'ending' || G.state === 'over') confirmKey();
});
canvas.addEventListener('pointermove', e => {
  if (!swipe || MENU_STATES.has(G.state)) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
  steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? R : L) : (dy > 0 ? D : U));
  swipe = { x: e.clientX, y: e.clientY };
});
window.addEventListener('pointerup', () => { swipe = null; });
const dashBtn = document.getElementById('dashBtn');
// The d-pad centre doubles as an OK button on menus, dialog and the tower.
const menuish = () => MENU_STATES.has(G.state) || G.state === 'over';
dashBtn.addEventListener('pointerdown', e => { e.preventDefault(); if (menuish()) confirmKey(); else triggerDash(); });
dpad.querySelectorAll('button[data-dir]').forEach(b => {
  b.addEventListener('pointerdown', e => { e.preventDefault(); steer(DIR_BY_NAME[b.dataset.dir]); });
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && !G.paused && !MENU_STATES.has(G.state) && G.state !== 'over') togglePause();
});

// ---------- Boot ----------
function start(data) {
  if (data && data.hi > hi) { hi = data.hi; saveHi(); }
  window.claude?.hot?.snapshot?.(() => ({ hi }));
  toMenu();
  resize();
  if (document.fonts) document.fonts.load('16px "Press Start 2P"').catch(() => {});
  let last = performance.now(), acc = 0;
  const DT = 1 / 120;
  function frame(now) {
    acc += Math.min(0.1, (now - last) / 1000);
    last = now;
    while (acc >= DT) { update(DT); acc -= DT; }
    render();
    const ok = menuish(), label = ok ? 'OK' : 'DASH';
    const dashOff = !ok && !(G.cfg.dash && G.state === 'play' && G.dashCharge >= 1);
    if (dashBtn.disabled !== dashOff) dashBtn.disabled = dashOff;
    if (dashBtn.textContent !== label) dashBtn.textContent = label;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  canvas.focus({ preventScroll: true });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</body></html>
