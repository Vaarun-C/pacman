<title>Pac-Man</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* Layout: one arcade screen, centered in a dark cabinet, controls tucked beneath */
  :root {
    --cab: #07081a;        /* cabinet surround, blue-black */
    --screen: #000000;     /* CRT black */
    --maze: #2a3cff;       /* maze blue */
    --pac: #ffe600;        /* pac yellow */
    --ink: #b9bddc;        /* muted label text */
    --ink-dim: #6b6f93;
    --edge: #1a1d44;
    --display: "Press Start 2P", "Courier New", monospace;
    --mono: "Space Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--cab);
    color: var(--ink);
    font-family: var(--mono);
    overflow: hidden;
  }
  main {
    height: 100%;
    box-sizing: border-box;
    padding-inline: 16px;
    padding-block: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  canvas {
    display: block;
    background: var(--screen);
    border-radius: 6px;
    box-shadow: 0 0 0 1px var(--edge), 0 0 40px rgba(42, 60, 255, 0.18);
    touch-action: none;
    max-width: 100%;
  }
  canvas:focus-visible { outline: 2px solid var(--pac); outline-offset: 3px; }
  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px 18px;
    font-size: 12px;
    letter-spacing: 0.02em;
  }
  .keys { color: var(--ink-dim); }
  kbd {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink);
    border: 1px solid var(--edge);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 5px;
  }
  .btn {
    font-family: var(--display);
    font-size: 9px;
    letter-spacing: 0.08em;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--edge);
    border-radius: 4px;
    padding: 8px 10px;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--maze); color: #fff; }
  .btn:focus-visible { outline: 2px solid var(--pac); outline-offset: 2px; }
  .btn[aria-pressed="true"] { border-color: var(--pac); color: var(--pac); }
  .dpad {
    display: none;
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(3, 52px);
    gap: 4px;
  }
  .dpad button {
    background: var(--edge);
    border: 0;
    border-radius: 10px;
    color: var(--ink);
    font-size: 18px;
    touch-action: none;
  }
  .dpad button:active { background: var(--maze); color: #fff; }
  .dpad .u { grid-area: 1 / 2; } .dpad .l { grid-area: 2 / 1; }
  .dpad .r { grid-area: 2 / 3; } .dpad .d { grid-area: 3 / 2; }
  .dpad .c { grid-area: 2 / 2; font-family: var(--display); font-size: 8px; letter-spacing: 0.05em; }
  .dpad .c:disabled { opacity: 0.35; }
  @media (pointer: coarse) {
    .dpad { display: grid; }
    .keys { display: none; }
  }
</style>

<main id="main">
  <canvas id="game" tabindex="0" aria-label="Pac-Man game. Use arrow keys to move."></canvas>
  <div class="dpad" id="dpad" aria-label="Direction pad">
    <button class="u" data-dir="U" aria-label="Up">▲</button>
    <button class="l" data-dir="L" aria-label="Left">◀</button>
    <button class="r" data-dir="R" aria-label="Right">▶</button>
    <button class="d" data-dir="D" aria-label="Down">▼</button>
    <button class="c" id="dashBtn" type="button" aria-label="Dash" disabled>DASH</button>
  </div>
  <div class="bar" id="bar">
    <span class="keys"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>WASD</kbd> move · <kbd>Enter</kbd> select / next · <kbd>Esc</kbd> back / skip talk · <kbd>P</kbd> pause · <kbd>Space</kbd> dash · <kbd>M</kbd> sound · <kbd>F</kbd> effects · <kbd>I</kbd> infinite lives · <kbd>N</kbd> skip level · <kbd>U</kbd> unlock all</span>
    <button class="btn" id="pauseBtn" type="button">PAUSE</button>
    <button class="btn" id="soundBtn" type="button">SOUND ON</button>
    <button class="btn" id="fxBtn" type="button" aria-pressed="true">FX: ON</button>
    <button class="btn" id="infBtn" type="button" aria-pressed="false">INFINITE LIVES: OFF</button>
    <button class="btn" id="skipBtn" type="button">SKIP LEVEL</button>
    <button class="btn" id="unlockBtn" type="button">UNLOCK ALL</button>
  </div>
</main>

function setMaze(key) {
  meta = MAZES[key]; M = meta.reform ? meta.rows.slice() : meta.rows; W = M[0].length; H = M.length; // rebuildable mazes get their own copy
  for (let r = 0; r < H; r++) {

function mapMaze() {
  // Tiles Pac-Man can reach; a frozen Wraith gets pushed onto the nearest one.
  openMask = new Uint8Array(W * H);
  const q = [[Math.floor(meta.pac.x), meta.pac.y]];
  openMask[meta.pac.y * W + Math.floor(meta.pac.x)] = 1;
  while (q.length) {
    const [c, r] = q.pop();
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nc = c + dx, nr = r + dy;
      if (nc < 0 || nc >= W || nr < 0 || nr >= H || openMask[nr * W + nc]) continue;
      const t = M[nr][nc];
      if (t === '#' || t === '-') continue;
      openMask[nr * W + nc] = 1; q.push([nc, nr]);
    }
  }
  tunnelRows = new Map();
  for (let r = 1; r < H - 1; r++) {
    if (M[r][0] === '#' || M[r][W - 1] === '#') continue;
    let e = 0;
    while (e < W && M[r][e] !== '#' && M[r - 1][e] === '#' && M[r + 1][e] === '#') e++;
    if (e > 0) tunnelRows.set(r, e);
  }
}
const tile = (c, r) => {

  if (c < 0 || c >= W) return tunnelRows.has(r) ? ' ' : '#';

};

let flowMap = [], hasFlow = false;

}

}

function update(dt) {
  G.t += dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt);
  if (G.paused) return;
  if (G.bossSay && (G.state === 'play' || G.state === 'phase' || G.state === 'ready') && (G.bossSay.t -= dt) <= 0) G.bossSay = null;
  switch (G.state) {
    case 'ready':
      G.timer -= dt;
      if (G.timer <= 0) { G.state = 'play'; if (G.boss && G.boss.hp === BOSSES[G.boss.kind].hp && !G.bossSay) bossTalk(BOSSES[G.boss.kind].lines.start); }
      break;
    case 'play': if (G.hitstop > 0) { G.hitstop -= dt; break; } play(dt); if (G.pendingPhase && G.state === 'play') startPhase(G.pendingPhase); break;
    case 'phase': G.timer -= dt; if (G.timer <= 0) endPhase(); break;
    case 'eatpause':
      G.timer -= dt;
      if (G.timer <= 0) { G.state = 'play'; G.eatenGhost = null; G.popups = G.popups.filter(p => !p.freeze); }
      break;
    case 'dying': {
      const before = G.timer; G.timer += dt;
      if (before < 1 && G.timer >= 1) SFX.death();
      if (G.timer >= 3.2) {
        if (!infinite) G.lives--;
        if (G.lives <= 0) { G.state = 'over'; G.timer = 0; }
        else {
          resetActors();
          if (G.boss) { const t = BOSSES[G.boss.kind].lines.taunt; bossTalk(t[Math.floor(Math.random() * t.length)]); }
          G.globalMode = true; G.globalDots = 0; G.bannerFull = false; G.state = 'ready'; G.timer = 2;
        }
      }
      break;
    }
    case 'clear':
      G.timer += dt;
      if (G.timer >= (G.cfg.boss ? 5.5 : 3)) finishLevel();
      break;
    case 'over': G.timer += dt; break;
    case 'dialog': dialogUpdate(dt); break;
    case 'menu': case 'cast': case 'tower': case 'ending': menuUpdate(dt); break;
  }
}

// ---------- Story screens ----------
// Draws with G.fright forced on, so sprites show their blue frightened face.
function withFright(on, fn) { const f = G.fright; if (on) G.fright = 5; fn(); G.fright = f; }
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function wrapText(s, maxW, size) {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.font = Math.round(px * size) + FONT;
  const out = []; let cur = '';
  for (const w of s.split(' ')) {
    const t = cur ? cur + ' ' + w : w;
    if (cur && ctx.measureText(t).width > maxW * px) { out.push(cur); cur = w; } else cur = t;
  }
  if (cur) out.push(cur);
  ctx.restore();
  return out;
}

function drawDialog() {
  const d = G.dlg, [who, msg, mood] = d.lines[d.i], sp = SPEAKERS[who];
  const typing = d.chars < msg.length;
  screenSpace();
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, SCREEN_COLS, TOTAL_ROWS);
  const bx = 0.7, by = 26.4, bw = 26.6, bh = 8.6;
  ctx.fillStyle = '#000000'; ctx.fillRect(bx, by, bw, bh);
  ctx.lineWidth = 0.14; ctx.strokeStyle = sp.color; ctx.strokeRect(bx, by, bw, bh);
  ctx.lineWidth = 0.06; ctx.strokeStyle = '#ffffff'; ctx.strokeRect(bx + 0.3, by + 0.3, bw - 0.6, bh - 0.6);
  let tx = bx + 1;
  if (sp.portrait) {
    const s = 5.4, x = bx + 0.9, y = by + 1.9;
    screenSpace();
    drawPortrait(who, mood, typing, x, y, s);
    screenSpace();
    ctx.lineWidth = 0.1; ctx.strokeStyle = sp.color; ctx.strokeRect(x, y, s, s);
    tx = x + s + 0.8;
  }
  text(sp.name, tx, by + 0.75, sp.color, 'left', 0.55);
  const lines = wrapText(msg, bx + bw - 0.9 - tx, 0.5);
  let left = Math.floor(d.chars);
  lines.forEach((l, j) => {
    if (left <= 0) return;
    text(l.slice(0, left), tx, by + 2.1 + j * 1.15, who === 'NARR' ? '#b9bddc' : '#ffffff', 'left', 0.5);
    left -= l.length + 1;

  audioOn();
  swipe = { x: e.clientX, y: e.clientY };
  const rect = canvas.getBoundingClientRect();
  const row = (e.clientY - rect.top) / rect.height * TOTAL_ROWS, col = (e.clientX - rect.left) / rect.width * SCREEN_COLS;
  if (G.state === 'menu') {
    const k = Math.floor((row - 16.6) / 2.2);
    if (k >= 0 && k < menuItems().length) {
      if (k !== G.menu.sel) G.menu.confirm = false;
      G.menu.sel = k; menuSelect();
    }
  } else if (G.state === 'tower') {
    const f = floorAt(row + towerCam(G.tower.py));
    if (f === null || !canEnter(f)) return;
    if (f === G.tower.sel) towerEnter(); else { G.tower.sel = f; SFX.tick(); }
  } else if (G.state === 'dialog') {
    if (row > 26.4 && row < 28.4 && col > 19) endDialog(); else dialogNext();
  } else if (G.state === 'cast' || G.state === 'ending' || G.state === 'over') confirmKey();
});
canvas.addEventListener('pointermove', e => {
  if (!swipe || MENU_STATES.has(G.state)) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
  const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? R : L) : (dy > 0 ? D : U);
  if (swipe.dir && swipe.dir !== dir) release(swipe.dir);
  press(dir); steer(dir); // a swipe keeps him moving that way until the finger lifts
  swipe = { x: e.clientX, y: e.clientY, dir };
});
window.addEventListener('keyup', e => { if (KEYS[e.key]) release(KEYS[e.key]); });
window.addEventListener('blur', () => { held = []; });
window.addEventListener('pointerup', () => { if (swipe && swipe.dir) release(swipe.dir); swipe = null; });
const dashBtn = document.getElementById('dashBtn');
// The d-pad centre doubles as an OK button on menus, dialog and the tower.
const menuish = () => MENU_STATES.has(G.state) || G.state === 'over';
dashBtn.addEventListener('pointerdown', e => { e.preventDefault(); if (menuish()) confirmKey(); else triggerDash(); });
dpad.querySelectorAll('button[data-dir]').forEach(b => {
  const dir = DIR_BY_NAME[b.dataset.dir];
  b.addEventListener('pointerdown', e => { e.preventDefault(); press(dir); steer(dir); });
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, () => release(dir));
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && !G.paused && !MENU_STATES.has(G.state) && G.state !== 'over') togglePause();
});

// ---------- Boot ----------
function start(data) {
  if (data && data.hi > hi) { hi = data.hi; saveHi(); }
  window.claude?.hot?.snapshot?.(() => ({ hi }));
  toMenu();
  resize();
  if (document.fonts) document.fonts.load('16px "Press Start 2P"').catch(() => {});
  let last = performance.now(), acc = 0;
  const DT = 1 / 120;
  function frame(now) {
    acc += Math.min(0.1, (now - last) / 1000);
    last = now;
    while (acc >= DT) { update(DT); acc -= DT; }
    render();
    const ok = menuish(), label = ok ? 'OK' : 'DASH';
    const dashOff = !ok && !(G.cfg.dash && G.state === 'play' && G.dashCharge >= 1);
    if (dashBtn.disabled !== dashOff) dashBtn.disabled = dashOff;
    if (dashBtn.textContent !== label) dashBtn.textContent = label;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  canvas.focus({ preventScroll: true });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
